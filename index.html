<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PATRONI 安全鞋規格查詢</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Sans:wght@400;500;700&display=swap">
</head>
<body style="margin:0;background:#ffffff;overflow:hidden">

<style>
#pt-finder{
  --pt-brand:#f8b500;
  --pt-ink:#111111;
  --pt-body:#6b6b6b;
  --pt-muted:#9fa0a0;
  --pt-line:#b5b5b6;
  --pt-hair:#d8d6d0;
  --pt-paper:#ffffff;
  --pt-tint:#f5f5f5;
  --pt-r-card:14px;
  --pt-r-box:8px;
  --pt-sans:'Noto Sans','Noto Sans TC',system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;

  all:initial;
  display:block; box-sizing:border-box;
  font-family:var(--pt-sans);
  font-size:16px; line-height:1.8; letter-spacing:.03em;
  color:var(--pt-ink); background:var(--pt-paper);
  -webkit-font-smoothing:antialiased;
  padding:clamp(14px,2.5vw,24px) clamp(14px,3vw,28px);
  overflow:hidden;
}
#pt-finder *,#pt-finder *::before,#pt-finder *::after{box-sizing:border-box;}
#pt-finder .pt-wrap{max-width:1120px;margin:0 auto;}

#pt-finder .pt-panel{
  border:1.2px solid var(--pt-line);border-radius:var(--pt-r-box);
  padding:clamp(13px,2vw,18px);margin-bottom:12px;
}
#pt-finder.is-collapsed .pt-panel{display:none;}
#pt-finder .pt-fields{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;}
#pt-finder .pt-field>label,#pt-finder .pt-field>span.pt-lab{
  display:block;font-size:11.5px;font-weight:700;letter-spacing:.13em;
  color:var(--pt-muted);margin-bottom:6px;
}
#pt-finder select,#pt-finder .pt-dd-btn{
  width:100%;font-family:var(--pt-sans);font-size:14.5px;line-height:1.5;
  color:var(--pt-ink);background:var(--pt-paper);
  border:1.2px solid var(--pt-line);border-radius:var(--pt-r-box);
  padding:9px 11px;letter-spacing:.02em;
  outline:none;transition:border-color .2s ease;
}
#pt-finder select:hover,#pt-finder select:focus,
#pt-finder .pt-dd-btn:hover,#pt-finder .pt-dd-btn[aria-expanded="true"]{border-color:var(--pt-ink);}

#pt-finder .pt-dd{position:relative;}
#pt-finder .pt-dd-btn{display:flex;align-items:center;gap:8px;text-align:left;cursor:pointer;}
#pt-finder .pt-dd-txt{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left;}
#pt-finder .pt-dd-txt span{direction:ltr;unicode-bidi:embed;}
#pt-finder .pt-dd-btn.is-empty .pt-dd-txt{color:var(--pt-body);direction:ltr;}
#pt-finder .pt-dd-n{
  flex:0 0 auto;font-size:11.5px;font-weight:700;line-height:1;
  background:var(--pt-brand);color:var(--pt-ink);border-radius:999px;padding:4px 8px;
}
#pt-finder .pt-dd-n[hidden]{display:none;}
#pt-finder .pt-dd-caret{flex:0 0 auto;width:11px;height:7px;transition:transform .2s ease;}
#pt-finder .pt-dd-btn[aria-expanded="true"] .pt-dd-caret{transform:rotate(180deg);}
#pt-finder .pt-dd-panel{
  position:absolute;top:calc(100% + 5px);left:0;right:0;z-index:40;
  background:var(--pt-paper);border:1.2px solid var(--pt-ink);border-radius:var(--pt-r-box);
  max-height:min(320px,54vh);overflow-y:auto;padding:4px;
  box-shadow:0 10px 26px rgba(0,0,0,.15);
}
#pt-finder .pt-dd-panel[hidden]{display:none;}
#pt-finder .pt-dd-opt{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:5px;cursor:pointer;font-size:14px;line-height:1.4;}
#pt-finder .pt-dd-opt:hover{background:var(--pt-tint);}
#pt-finder .pt-dd-opt[aria-selected="true"],
#pt-finder .pt-dd-opt[aria-selected="true"]:hover{background:var(--pt-brand);font-weight:700;}
#pt-finder .pt-dd-opt[aria-disabled="true"]{color:var(--pt-hair);cursor:not-allowed;}
#pt-finder .pt-dd-opt[aria-disabled="true"]:hover{background:transparent;}
#pt-finder .pt-dd-box{
  flex:0 0 auto;width:16px;height:16px;border:1.4px solid var(--pt-line);
  border-radius:4px;display:flex;align-items:center;justify-content:center;background:var(--pt-paper);
}
#pt-finder .pt-dd-box svg{width:10px;height:8px;opacity:0;}
#pt-finder .pt-dd-opt[aria-selected="true"] .pt-dd-box{background:var(--pt-ink);border-color:var(--pt-ink);}
#pt-finder .pt-dd-opt[aria-selected="true"] .pt-dd-box svg{opacity:1;}
#pt-finder .pt-dd-opt[aria-disabled="true"] .pt-dd-box{border-color:var(--pt-hair);}
#pt-finder .pt-dd-code{margin-left:auto;font-size:11px;color:var(--pt-muted);letter-spacing:.04em;}
#pt-finder .pt-dd-opt[aria-selected="true"] .pt-dd-code{color:var(--pt-ink);}

#pt-finder .pt-foot{
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  margin-top:13px;padding-top:11px;border-top:1.2px solid var(--pt-hair);
}
#pt-finder .pt-logic{display:flex;align-items:center;gap:15px;flex-wrap:wrap;}
#pt-finder .pt-radio{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;cursor:pointer;}
#pt-finder .pt-radio input{margin:0;accent-color:var(--pt-brand);width:16px;height:16px;}
#pt-finder .pt-acts{display:flex;align-items:center;gap:9px;}

#pt-finder .pt-btn{
  font-family:var(--pt-sans);font-size:13px;font-weight:700;letter-spacing:.04em;line-height:1;
  border-radius:999px;padding:10px 22px;cursor:pointer;white-space:nowrap;
  border:1.2px solid var(--pt-brand);background:var(--pt-brand);color:var(--pt-ink);
  transition:background-color .2s ease,color .2s ease,filter .2s ease;
}
#pt-finder .pt-btn:hover{filter:brightness(.94);}
#pt-finder .pt-btn--ghost{border-color:var(--pt-ink);background:transparent;color:var(--pt-ink);}
#pt-finder .pt-btn--ghost:hover,
#pt-finder .pt-btn--ghost.is-active{background:var(--pt-ink);color:var(--pt-paper);filter:none;}
#pt-finder .pt-btn[disabled]{opacity:.3;cursor:not-allowed;filter:none;}
#pt-finder .pt-btn--sm{padding:8px 15px;font-size:12.5px;}

#pt-finder .pt-bar{display:flex;align-items:center;gap:10px;margin-bottom:11px;min-height:36px;}
#pt-finder .pt-toggle{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;
  font-family:var(--pt-sans);font-size:13px;font-weight:700;letter-spacing:.04em;line-height:1;
  border:1.2px solid var(--pt-line);background:var(--pt-paper);color:var(--pt-ink);
  border-radius:999px;padding:9px 16px;cursor:pointer;transition:border-color .2s ease;
}
#pt-finder .pt-toggle:hover{border-color:var(--pt-ink);}
#pt-finder .pt-toggle svg{width:11px;height:7px;transition:transform .2s ease;}
#pt-finder:not(.is-collapsed) .pt-toggle svg{transform:rotate(180deg);}
#pt-finder .pt-count{flex:0 0 auto;font-size:13px;color:var(--pt-body);letter-spacing:.04em;white-space:nowrap;}
#pt-finder .pt-count b{font-size:18px;font-weight:700;color:var(--pt-ink);letter-spacing:0;}
#pt-finder .pt-pills{
  flex:1 1 auto;min-width:0;display:flex;gap:5px;overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 22px),transparent);
  mask-image:linear-gradient(90deg,#000 calc(100% - 22px),transparent);
}
#pt-finder .pt-pill{
  display:inline-flex;align-items:center;gap:5px;flex:0 0 auto;
  font-size:12px;line-height:1;padding:6px 7px 6px 11px;border-radius:999px;
  background:var(--pt-brand);color:var(--pt-ink);font-weight:700;
}
#pt-finder .pt-pill.pt-plain{background:var(--pt-tint);color:var(--pt-body);font-weight:400;padding:6px 11px;}
#pt-finder .pt-pill button{
  border:0;background:none;cursor:pointer;color:inherit;font-family:var(--pt-sans);
  font-size:13.5px;line-height:1;padding:0 2px;
}
#pt-finder .pt-barbtns{flex:0 0 auto;margin-left:auto;}

#pt-finder #pt-results{overflow:hidden;}

#pt-finder .pt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(206px,1fr));gap:12px;}
#pt-finder .pt-card{
  display:flex;flex-direction:column;position:relative;
  border:1.2px solid var(--pt-line);border-radius:var(--pt-r-card);
  overflow:hidden;cursor:pointer;transition:border-color .15s ease,box-shadow .15s ease;
}
#pt-finder .pt-card:hover{border-color:var(--pt-ink);box-shadow:0 3px 12px rgba(0,0,0,.06);}
#pt-finder .pt-cthumb{background:var(--pt-tint);flex:1 1 auto;min-height:118px;max-height:230px;}
#pt-finder .pt-cthumb img{width:100%;height:100%;object-fit:contain;display:block;}
#pt-finder .pt-cchk{
  position:absolute;top:8px;left:8px;z-index:2;display:flex;align-items:center;gap:5px;
  background:rgba(255,255,255,.93);border:1.2px solid var(--pt-line);
  border-radius:999px;padding:4px 9px;font-size:11px;font-weight:700;letter-spacing:.04em;cursor:pointer;
}
#pt-finder .pt-cchk input{margin:0;accent-color:var(--pt-brand);width:14px;height:14px;cursor:pointer;}
#pt-finder .pt-cbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1;}
#pt-finder .pt-card .pt-btn{margin-top:auto;width:100%;padding:9px 10px;}

#pt-finder .pt-list{display:flex;flex-direction:column;gap:8px;}
#pt-finder .pt-row{
  display:flex;align-items:center;gap:11px;height:82px;padding-right:11px;
  border:1.2px solid var(--pt-line);border-radius:var(--pt-r-box);
  overflow:hidden;cursor:pointer;transition:border-color .15s ease,background-color .15s ease;
}
#pt-finder .pt-row:hover{border-color:var(--pt-ink);background:#fcfbf9;}
#pt-finder .pt-rowchk{flex:0 0 auto;display:flex;align-items:center;padding-left:11px;cursor:pointer;}
#pt-finder .pt-rowchk input{margin:0;accent-color:var(--pt-brand);width:17px;height:17px;cursor:pointer;}
#pt-finder .pt-rowimg{flex:0 0 auto;width:104px;height:100%;background:var(--pt-tint);}
#pt-finder .pt-rowimg img{width:100%;height:100%;object-fit:contain;display:block;}
#pt-finder .pt-rowmain{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:4px;}

#pt-finder .pt-model{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--pt-muted);white-space:nowrap;}
#pt-finder .pt-name{font-size:15.5px;font-weight:700;line-height:1.35;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#pt-finder .pt-rowtop{display:flex;align-items:baseline;gap:9px;min-width:0;}
#pt-finder .pt-tags{
  display:flex;gap:5px;flex-wrap:nowrap;overflow:hidden;min-width:0;
  -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 26px),transparent);
  mask-image:linear-gradient(90deg,#000 calc(100% - 26px),transparent);
}
#pt-finder .pt-tag{
  flex:0 0 auto;font-size:11.5px;line-height:1.4;padding:3px 9px;border-radius:999px;
  background:var(--pt-tint);border:1px solid var(--pt-hair);color:var(--pt-body);
  letter-spacing:.02em;white-space:nowrap;
}
#pt-finder .pt-tag.pt-cert{background:var(--pt-paper);border-color:var(--pt-line);color:var(--pt-ink);font-weight:700;}
#pt-finder .pt-tag.pt-hit{background:var(--pt-brand);border-color:var(--pt-brand);color:var(--pt-ink);font-weight:700;}

#pt-finder .pt-pager{display:flex;align-items:center;justify-content:center;gap:12px;height:46px;}
#pt-finder .pt-pg{
  font-family:var(--pt-sans);font-size:12.5px;font-weight:700;letter-spacing:.04em;line-height:1;
  border:1.2px solid var(--pt-ink);background:transparent;color:var(--pt-ink);
  border-radius:999px;padding:9px 17px;cursor:pointer;
}
#pt-finder .pt-pg:hover:not([disabled]){background:var(--pt-ink);color:var(--pt-paper);}
#pt-finder .pt-pg[disabled]{opacity:.25;cursor:not-allowed;}
#pt-finder .pt-pgnum{font-size:12.5px;color:var(--pt-body);letter-spacing:.06em;min-width:6.5em;text-align:center;}
#pt-finder .pt-pgnum b{color:var(--pt-ink);}
#pt-finder .pt-pager.is-off{visibility:hidden;}

#pt-finder .pt-empty{
  border:1.2px dashed var(--pt-line);border-radius:var(--pt-r-box);
  padding:36px 20px;text-align:center;color:var(--pt-body);font-size:14px;
}

#pt-finder .pt-dhead{display:flex;align-items:center;gap:14px;margin-bottom:12px;}
#pt-finder .pt-dimg{flex:0 0 auto;width:116px;height:87px;background:var(--pt-tint);border-radius:var(--pt-r-box);overflow:hidden;}
#pt-finder .pt-dimg img{width:100%;height:100%;object-fit:contain;display:block;}
#pt-finder .pt-dmeta{flex:1 1 auto;min-width:0;}
#pt-finder .pt-dmeta h3{font-size:18px;font-weight:700;line-height:1.3;margin:2px 0 1px;letter-spacing:.02em;}
#pt-finder .pt-dmeta .pt-sub{font-size:12.5px;color:var(--pt-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

#pt-finder .pt-tabs{display:flex;gap:6px;border-bottom:1.2px solid var(--pt-hair);margin-bottom:10px;}
#pt-finder .pt-tab{
  font-family:var(--pt-sans);font-size:13px;font-weight:700;letter-spacing:.04em;
  border:0;background:none;color:var(--pt-muted);cursor:pointer;
  padding:9px 13px;border-bottom:2.5px solid transparent;margin-bottom:-1.2px;
}
#pt-finder .pt-tab:hover{color:var(--pt-ink);}
#pt-finder .pt-tab[aria-selected="true"]{color:var(--pt-ink);border-bottom-color:var(--pt-brand);}

#pt-finder table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13.5px;}
#pt-finder th,#pt-finder td{border-bottom:1px solid var(--pt-hair);padding:0 10px;height:36px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#pt-finder thead th{background:var(--pt-tint);font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--pt-ink);height:40px;}
#pt-finder th:first-child,#pt-finder td:first-child{text-align:left;color:var(--pt-body);font-weight:500;}
#pt-finder .pt-spec td:last-child{text-align:left;color:var(--pt-ink);white-space:normal;}
#pt-finder .pt-spec th{width:6.4em;font-size:12.5px;}
#pt-finder .pt-dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--pt-brand);}
#pt-finder .pt-none{color:var(--pt-hair);}

#pt-finder .pt-flist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:0 14px;}
#pt-finder .pt-flist li{display:flex;gap:8px;align-items:center;height:34px;font-size:13px;white-space:nowrap;}
#pt-finder .pt-fc{
  flex:0 0 auto;font-size:10px;font-weight:700;letter-spacing:.05em;
  padding:2px 6px;border-radius:4px;background:var(--pt-tint);
  border:1px solid var(--pt-hair);color:var(--pt-muted);
}
#pt-finder .pt-flist li.pt-hit .pt-fc{background:var(--pt-brand);border-color:var(--pt-brand);color:var(--pt-ink);}
#pt-finder .pt-flist li.pt-hit>span:last-child{font-weight:700;}

#pt-finder .pt-clist{display:flex;flex-direction:column;gap:8px;}
#pt-finder .pt-crow{
  display:flex;align-items:center;gap:12px;height:64px;width:100%;
  border:1.2px solid var(--pt-hair);border-radius:var(--pt-r-box);overflow:hidden;
  background:none;padding:0;cursor:zoom-in;text-align:left;font-family:var(--pt-sans);
}
#pt-finder .pt-crow:hover{border-color:var(--pt-ink);}
#pt-finder .pt-crow.pt-hit{border-color:var(--pt-brand);}
#pt-finder .pt-crow img{flex:0 0 auto;width:82px;height:100%;object-fit:cover;background:var(--pt-tint);}
#pt-finder .pt-cmeta{min-width:0;}
#pt-finder .pt-cmeta b{display:block;font-size:13.5px;font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--pt-ink);}
#pt-finder .pt-cmeta span{display:block;font-size:11.5px;color:var(--pt-muted);}

#pt-finder .pt-lb{
  position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
  padding:clamp(16px,4vw,40px);background:rgba(17,17,17,.9);
}
#pt-finder .pt-lb[hidden]{display:none;}
#pt-finder .pt-lb img{max-width:100%;max-height:100%;object-fit:contain;background:var(--pt-paper);border-radius:var(--pt-r-box);}
#pt-finder .pt-lbx{
  position:absolute;top:14px;right:16px;width:40px;height:40px;border-radius:50%;
  background:rgba(255,255,255,.9);border:0;color:var(--pt-ink);
  font-family:var(--pt-sans);font-size:20px;line-height:1;cursor:pointer;
}

@media (max-width:900px){
  #pt-finder .pt-fields{grid-template-columns:1fr;gap:9px;}
}
@media (max-width:600px){
  #pt-finder{padding:12px;}
  #pt-finder .pt-row{height:74px;gap:9px;padding-right:9px;}
  #pt-finder .pt-rowimg{width:82px;}
  #pt-finder .pt-rowchk{padding-left:9px;}
  #pt-finder .pt-name{font-size:14.5px;}
  #pt-finder .pt-dimg{width:86px;height:66px;}
  #pt-finder .pt-dmeta h3{font-size:16px;}
  #pt-finder .pt-acts{width:100%;}
  #pt-finder .pt-acts .pt-btn{flex:1 1 0;}
  #pt-finder .pt-flist{grid-template-columns:1fr 1fr;gap:0 8px;}
  #pt-finder .pt-flist li{font-size:12px;gap:6px;height:32px;}
  #pt-finder th,#pt-finder td{padding:0 6px;font-size:11.5px;height:34px;}
  #pt-finder .pt-spec th{width:5.2em;font-size:11px;}
  #pt-finder .pt-crow{height:56px;gap:9px;}
  #pt-finder .pt-crow img{width:68px;}
}
</style>

<div id="pt-finder">
  <div class="pt-wrap">
    <form class="pt-panel" id="pt-form">
      <div class="pt-fields">
        <div class="pt-field">
          <label for="pt-sel-product">品項</label>
          <select id="pt-sel-product"></select>
        </div>
        <div class="pt-field">
          <span class="pt-lab">功能</span>
          <div class="pt-dd" id="pt-dd-feature">
            <button type="button" class="pt-dd-btn is-empty" aria-expanded="false" aria-haspopup="listbox">
              <span class="pt-dd-txt">全部功能</span>
              <span class="pt-dd-n" hidden></span>
              <svg class="pt-dd-caret" viewBox="0 0 11 7" fill="none" aria-hidden="true"><path d="M1 1l4.5 4.5L10 1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            </button>
            <div class="pt-dd-panel" role="listbox" aria-multiselectable="true" hidden></div>
          </div>
        </div>
        <div class="pt-field">
          <span class="pt-lab">證書</span>
          <div class="pt-dd" id="pt-dd-cert">
            <button type="button" class="pt-dd-btn is-empty" aria-expanded="false" aria-haspopup="listbox">
              <span class="pt-dd-txt">全部證書</span>
              <span class="pt-dd-n" hidden></span>
              <svg class="pt-dd-caret" viewBox="0 0 11 7" fill="none" aria-hidden="true"><path d="M1 1l4.5 4.5L10 1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            </button>
            <div class="pt-dd-panel" role="listbox" aria-multiselectable="true" hidden></div>
          </div>
        </div>
      </div>

      <div class="pt-foot">
        <div class="pt-logic">
          <label class="pt-radio"><input type="radio" name="pt-mode" value="AND" checked>全部符合</label>
          <label class="pt-radio"><input type="radio" name="pt-mode" value="OR">任一符合</label>
        </div>
        <div class="pt-acts">
          <button type="button" class="pt-btn pt-btn--ghost" id="pt-reset">重設</button>
          <button type="submit" class="pt-btn" id="pt-submit">查詢</button>
        </div>
      </div>
    </form>

    <div class="pt-bar">
      <button type="button" class="pt-toggle" id="pt-toggle">
        <svg viewBox="0 0 11 7" fill="none" aria-hidden="true"><path d="M1 1l4.5 4.5L10 1" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <span id="pt-togglelabel">查詢條件</span>
      </button>
      <span class="pt-count" id="pt-headline"></span>
      <span class="pt-pills" id="pt-pills"></span>
      <span class="pt-barbtns">
        <button type="button" class="pt-btn pt-btn--ghost pt-btn--sm" id="pt-viewbtn" disabled>比較</button>
      </span>
    </div>

    <div id="pt-results"></div>
  </div>

  <div class="pt-lb" id="pt-lb" hidden>
    <button type="button" class="pt-lbx" id="pt-lbx" aria-label="關閉">&times;</button>
    <img id="pt-lbimg" alt="">
  </div>
</div>

<script>
(function(){

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

Object.keys(DD).forEach(function(kind){

  d.btn=d.root.querySelector(".pt-dd-btn");
  d.txt=d.root.querySelector(".pt-dd-txt");
  d.num=d.root.querySelector(".pt-dd-n");
  d.panel=d.root.querySelector(".pt-dd-panel");
  d.panel.innerHTML=d.list.map(function(x){
    return '<div class="pt-dd-opt" role="option" data-v="'+x.id+'" aria-selected="false">'+
      '<span class="pt-dd-box">'+CHECK+'</span><span>'+esc(x.name)+'</span>'+
      (x.code?'<span class="pt-dd-code">'+esc(x.code)+'</span>':'')+'</div>';
  }).join("");

  d.btn.addEventListener("click",function(e){
    e.stopPropagation();
    var willOpen=d.panel.hidden;
    closeAllDD();
    if(willOpen){ d.panel.hidden=false; d.btn.setAttribute("aria-expanded","true"); }
  });
  d.panel.addEventListener("click",function(e){
    e.stopPropagation();
    var o=e.target.closest(".pt-dd-opt");
    if(!o||o.getAttribute("aria-disabled")==="true") return;
    var v=o.getAttribute("data-v"), i=pick[kind].indexOf(v);
    if(i>=0) pick[kind].splice(i,1); else pick[kind].push(v);
    syncFields();
  });
});
function closeAllDD(){
  Object.keys(DD).forEach(function(k){
    DD[k].panel.hidden=true;
    DD[k].btn.setAttribute("aria-expanded","false");

}

/* 選單按鈕：計數獨立顯示不會被截掉，名稱由新到舊排，擠不下的自動被蓋掉 */
function syncFields(){
  var pid=elP.value, prod=pid?P[pid]:null;

  Object.keys(DD).forEach(function(kind){
    var d=DD[kind];
    var own = prod ? (kind==="feature"?prod.features:prod.certs) : null;
    pick[kind]=pick[kind].filter(function(v){ return !own || own.indexOf(v)>=0; });

    Array.prototype.forEach.call(d.panel.children,function(o){
      var v=o.getAttribute("data-v");
      o.setAttribute("aria-disabled", own && own.indexOf(v)<0 ? "true":"false");
      o.setAttribute("aria-selected", pick[kind].indexOf(v)>=0 ? "true":"false");
    });

    var names=pick[kind].slice().reverse().map(function(v){
      var x=(kind==="feature"?F:C)[v]; return x?x.name:v; });
    d.txt.innerHTML = names.length ? '<span>'+esc(names.join("、"))+'</span>' : esc(d.empty);
    d.num.textContent = names.length||"";
    d.num.hidden = !names.length;
    d.btn.classList.toggle("is-empty",!names.length);
  });
}

function matches(p){
  if(applied.product && p.id!==applied.product) return false;
  if(applied.features.length){
    var okF=applied.mode==="AND"
      ? applied.features.every(function(f){return p.features.indexOf(f)>=0;})
      : applied.features.some(function(f){return p.features.indexOf(f)>=0;});
    if(!okF) return false;
  }
  if(applied.certs.length){
    var okC=applied.mode==="AND"
      ? applied.certs.every(function(c){return p.certs.indexOf(c)>=0;})
      : applied.certs.some(function(c){return p.certs.indexOf(c)>=0;});
    if(!okC) return false;
  }
  return true;
}
function results(){ return PRODUCTS.filter(matches); }
function isHitF(id){ return applied.features.indexOf(id)>=0; }
function isHitC(id){ return applied.certs.indexOf(id)>=0; }

function conds(){
  var out=[];
  if(applied.product) out.push(['p','',applied.product]);
  applied.features.forEach(function(id){ if(F[id]) out.push(['f',id,F[id].name]); });
  applied.certs.forEach(function(id){ if(C[id]) out.push(['c',id,C[id].name]); });
  return out;
}

function syncBar(){
  var list=results();
  elToggleLb.textContent = collapsed ? "查詢條件" : "收起條件";

  if(view==="detail"){
    elHead.textContent="品項明細";
    elPills.innerHTML='<span class="pt-pill pt-plain">'+esc(detailId)+'</span>';
    elView.textContent="返回列表"; elView.disabled=false; elView.classList.add("is-active");
  } else if(view==="compare"){
    elHead.innerHTML='比較 <b>'+compare.length+'</b> 項';
    elPills.innerHTML=compare.map(function(id){
      return '<span class="pt-pill pt-plain">'+esc(id)+'</span>';}).join("");
    elView.textContent="關閉比較"; elView.disabled=false; elView.classList.add("is-active");
  } else {
    elHead.innerHTML='符合 <b>'+list.length+'</b> 項';
    var cs=conds();
    elPills.innerHTML = cs.length
      ? cs.map(function(x){
          return '<span class="pt-pill">'+esc(x[2])+'<button type="button" data-rm="'+x[0]+'" data-id="'+x[1]+'" aria-label="移除">&times;</button></span>';
        }).join("")
      : '<span class="pt-pill pt-plain">未設條件</span>';
    elView.classList.remove("is-active");
    elView.textContent = compare.length>=2 ? "比較 ("+compare.length+")" : "比較";
    elView.disabled = compare.length<2;
  }
}

function availH(){
  var top=elRes.getBoundingClientRect().top-root.getBoundingClientRect().top;
  var pad=parseFloat(getComputedStyle(root).paddingBottom)||16;
  return Math.max(0,(window.innerHeight||600)-top-pad);
}

function pagerHTML(page,pages){
  return '<div class="pt-pager'+(pages>1?"":" is-off")+'">'+
    '<button type="button" class="pt-pg" data-pg="prev"'+(page<=1?" disabled":"")+'>上一頁</button>'+
    '<span class="pt-pgnum">第 <b>'+page+'</b> / '+pages+' 頁</span>'+
    '<button type="button" class="pt-pg" data-pg="next"'+(page>=pages?" disabled":"")+'>下一頁</button></div>';
}

function render(){
  syncBar();
  elRes.style.display="";
  var H=availH();
  if(H<96){ elRes.style.display="none"; return; }
  elRes.style.height=H+"px";
  if(view==="detail") renderDetail(H);
  else if(view==="compare") renderCompare(H);
  else renderCards(H);
}

function certTagsHTML(p,cap){
  return p.certs.slice().sort(function(a,b){return (isHitC(b)?1:0)-(isHitC(a)?1:0);})
    .slice(0,cap).map(function(id){
      return '<span class="pt-tag pt-cert'+(isHitC(id)?" pt-hit":"")+'">'+esc(C[id].name)+'</span>';}).join("");
}
function featTagsHTML(p,cap){
  return p.features.slice().sort(function(a,b){return (isHitF(b)?1:0)-(isHitF(a)?1:0);})
    .slice(0,cap).map(function(id){
      return '<span class="pt-tag'+(isHitF(id)?" pt-hit":"")+'">'+esc(F[id].name)+'</span>';}).join("");
}
function tagsHTML(p,certCap,featCap){
  return certTagsHTML(p,certCap)+featTagsHTML(p,featCap);
}

function cardHTML(p){

    '<label class="pt-cchk"><input type="checkbox" data-cmp="'+p.id+'"'+(compare.indexOf(p.id)>=0?" checked":"")+' aria-label="加入比較">比較</label>'+
    '<div class="pt-cthumb"><img src="'+esc(p.img)+'" alt="'+esc(p.name)+'" loading="lazy"></div>'+
    '<div class="pt-cbody">'+
      '<span class="pt-model">'+esc(p.id)+'</span>'+
      '<h4 class="pt-name">'+esc(p.name)+'</h4>'+
      '<div class="pt-tags">'+certTagsHTML(p,3)+'</div>'+
      '<div class="pt-tags">'+featTagsHTML(p,5)+'</div>'+
      '<button type="button" class="pt-btn" data-open="'+p.id+'">展開</button>'+
    '</div></article>';
}

function rowHTML(p){

    '<label class="pt-rowchk"><input type="checkbox" data-cmp="'+p.id+'"'+(compare.indexOf(p.id)>=0?" checked":"")+' aria-label="加入比較"></label>'+
    '<div class="pt-rowimg"><img src="'+esc(p.img)+'" alt="'+esc(p.name)+'" loading="lazy"></div>'+
    '<div class="pt-rowmain">'+
      '<div class="pt-rowtop"><h4 class="pt-name">'+esc(p.name)+'</h4><span class="pt-model">'+esc(p.id)+'</span></div>'+
      '<div class="pt-tags">'+tagsHTML(p,narrow()?1:2,narrow()?2:4)+'</div>'+
    '</div></article>';
}

function renderCards(H){
  var list=results();
  if(!list.length){
    elRes.innerHTML='<div class="pt-empty">無符合條件的品項，請減少條件或改為「任一符合」。</div>';
    return;
  }
  var space=H-PAGER_H, per=0, cards=false, cardRows=1;

  if(useCards()){
    /* 先畫一張量高度，再回推一頁排得下幾列；空間不足一張就退回橫列 */
    elRes.innerHTML='<div class="pt-grid">'+cardHTML(list[0])+'</div>';
    var grid=elRes.firstChild, one=grid.firstElementChild;
    if(one.offsetHeight<=space){
      var cols=getComputedStyle(grid).gridTemplateColumns.split(" ").filter(Boolean).length;
      cardRows=Math.max(1,Math.floor((space+GAP)/(one.offsetHeight+GAP)));
      per=cols*cardRows;
      cards=true;
    }
  }
  if(!cards){
    var rowH=(narrow()?74:82)+8;
    if(space<rowH-8){ elRes.style.display="none"; return; }
    per=Math.max(1,Math.floor(space/rowH));
  }

  var pages=Math.max(1,Math.ceil(list.length/per));
  page=Math.min(Math.max(1,page),pages);
  var shown=list.slice((page-1)*per,(page-1)*per+per);

  if(cards){
    elRes.innerHTML='<div class="pt-grid">'+shown.map(cardHTML).join("")+'</div>'+pagerHTML(page,pages);
    /* 撐滿可用高度，圖片吃掉多出來的空間，不留下大片空白 */
    var g=elRes.firstChild;
    g.style.height=space+"px";
    g.style.gridTemplateRows="repeat("+cardRows+",1fr)";
  } else {
    elRes.innerHTML='<div class="pt-list">'+shown.map(rowHTML).join("")+'</div>'+pagerHTML(page,pages);
  }
}

function renderDetail(H){
  var p=P[detailId];

  elRes.innerHTML='<div class="pt-dhead">'+
      '<div class="pt-dimg"><img src="'+esc(p.img)+'" alt="'+esc(p.name)+'"></div>'+
      '<div class="pt-dmeta"><span class="pt-model">'+esc(p.id)+'</span>'+
        '<h3>'+esc(p.name)+'</h3><div class="pt-sub">'+esc(p.series)+'</div></div>'+
      (p.url?'<a class="pt-btn pt-btn--sm pt-btn--ghost" href="'+esc(p.url)+'" target="_blank" rel="noopener">商品頁</a>':"")+
    '</div>'+
    '<div class="pt-tabs" role="tablist">'+
      '<button type="button" class="pt-tab" data-dtab="spec" role="tab" aria-selected="'+(dTab==="spec")+'">規格</button>'+
      '<button type="button" class="pt-tab" data-dtab="feat" role="tab" aria-selected="'+(dTab==="feat")+'">功能 '+p.features.length+'</button>'+
      '<button type="button" class="pt-tab" data-dtab="cert" role="tab" aria-selected="'+(dTab==="cert")+'">證書 '+p.certs.length+'</button>'+
    '</div><div id="pt-tabbody"></div>';

  var body=$("pt-tabbody");
  var avail=H-(body.getBoundingClientRect().top-elRes.getBoundingClientRect().top)-PAGER_H;

  if(dTab==="spec"){
    var perS=Math.max(1,Math.floor(avail/36));
    var pagesS=Math.max(1,Math.ceil(SPEC_ROWS.length/perS));
    page=Math.min(Math.max(1,page),pagesS);
    body.innerHTML='<table class="pt-spec"><tbody>'+
      SPEC_ROWS.slice((page-1)*perS,(page-1)*perS+perS).map(function(r){
        return '<tr><th>'+esc(r[1])+'</th><td>'+esc(p.spec[r[0]]||"—")+'</td></tr>';}).join("")+
      '</tbody></table>'+pagerHTML(page,pagesS);
    return;
  }

  if(dTab==="feat"){
    var lineH=narrow()?32:34;
    var cols=narrow()?2:Math.max(1,Math.floor(elRes.clientWidth/182));
    var perF=Math.max(cols,cols*Math.floor(avail/lineH));
    var pagesF=Math.max(1,Math.ceil(p.features.length/perF));
    page=Math.min(Math.max(1,page),pagesF);
    body.innerHTML='<ul class="pt-flist">'+
      p.features.slice((page-1)*perF,(page-1)*perF+perF).map(function(fid){
        var f=F[fid]; if(!f) return "";
        return '<li class="'+(isHitF(fid)?"pt-hit":"")+'"><span class="pt-fc">'+esc(f.code||"·")+'</span><span>'+esc(f.name)+'</span></li>';
      }).join("")+'</ul>'+pagerHTML(page,pagesF);
    return;
  }

  var rowH=(narrow()?56:64)+8;
  var perC=Math.max(1,Math.floor(avail/rowH));
  var pagesC=Math.max(1,Math.ceil(p.certs.length/perC));
  page=Math.min(Math.max(1,page),pagesC);
  body.innerHTML='<div class="pt-clist">'+
    p.certs.slice((page-1)*perC,(page-1)*perC+perC).map(function(cid){
      var c=C[cid]; if(!c) return "";
      return '<button type="button" class="pt-crow'+(isHitC(cid)?" pt-hit":"")+'" data-cert="'+c.id+'">'+
        '<img src="'+esc(c.img)+'" alt="" loading="lazy">'+
        '<span class="pt-cmeta"><b>'+esc(c.name)+'</b><span>'+esc(c.note)+'</span></span></button>';
    }).join("")+'</div>'+pagerHTML(page,pagesC);
}

function renderCompare(H){
  var ps=compare.map(function(id){return P[id];}).filter(Boolean);
  elRes.innerHTML='<div class="pt-tabs" role="tablist">'+
      '<button type="button" class="pt-tab" data-ctab="spec" role="tab" aria-selected="'+(cTab==="spec")+'">規格</button>'+
      '<button type="button" class="pt-tab" data-ctab="cert" role="tab" aria-selected="'+(cTab==="cert")+'">證書</button>'+
      '<button type="button" class="pt-tab" data-ctab="feat" role="tab" aria-selected="'+(cTab==="feat")+'">功能</button>'+
    '</div><div id="pt-tabbody"></div>';

  var body=$("pt-tabbody");
  var avail=H-(body.getBoundingClientRect().top-elRes.getBoundingClientRect().top)-PAGER_H;
  var cellH=narrow()?34:36, headH=narrow()?38:40;
  var perRow=Math.max(2,Math.floor((avail-headH)/cellH));
  var dot=function(y){return y?'<span class="pt-dot"></span>':'<span class="pt-none">—</span>';};
  var head='<thead><tr><th>項目</th>'+ps.map(function(p){
    return '<th>'+esc(p.id)+'</th>';}).join("")+'</tr></thead>';

  var rows;
  if(cTab==="spec"){
    rows=SPEC_ROWS.map(function(r){
      return '<tr><td>'+esc(r[1])+'</td>'+ps.map(function(p){
        return '<td title="'+esc(p.spec[r[0]]||"")+'">'+esc(p.spec[r[0]]||"—")+'</td>';}).join("")+'</tr>';});
  } else if(cTab==="cert"){
    rows=CERTS.filter(function(c){return ps.some(function(p){return p.certs.indexOf(c.id)>=0;});})
      .map(function(c){
        return '<tr><td>'+esc(c.name)+'</td>'+ps.map(function(p){
          return '<td>'+dot(p.certs.indexOf(c.id)>=0)+'</td>';}).join("")+'</tr>';});
  } else {
    rows=FEATURES.filter(function(f){return ps.some(function(p){return p.features.indexOf(f.id)>=0;});})
      .map(function(f){
        return '<tr><td>'+esc(f.name)+'</td>'+ps.map(function(p){
          return '<td>'+dot(p.features.indexOf(f.id)>=0)+'</td>';}).join("")+'</tr>';});
  }
  var pages=Math.max(1,Math.ceil(rows.length/perRow));
  page=Math.min(Math.max(1,page),pages);
  body.innerHTML='<table>'+head+'<tbody>'+
    rows.slice((page-1)*perRow,(page-1)*perRow+perRow).join("")+'</tbody></table>'+pagerHTML(page,pages);
}

function writeHash(){
  var parts=[];
  if(applied.product) parts.push("p="+applied.product);
  if(applied.features.length) parts.push("f="+applied.features.join(","));
  if(applied.certs.length) parts.push("c="+applied.certs.join(","));
  if(applied.mode!=="AND") parts.push("m=or");
  var h=parts.length?"#pt:"+parts.join("&"):"";
  if(h!==location.hash&&(h||location.hash.indexOf("#pt:")===0)){
    history.replaceState(null,"",location.pathname+location.search+h);
  }
}
function readHash(){
  if(location.hash.indexOf("#pt:")!==0) return;
  location.hash.slice(4).split("&").forEach(function(kv){
    var i=kv.indexOf("="); if(i<0) return;
    var k=kv.slice(0,i), v=decodeURIComponent(kv.slice(i+1));
    if(k==="p"&&P[v]) applied.product=v;
    if(k==="f") applied.features=v.split(",").filter(function(x){return F[x];});
    if(k==="c") applied.certs=v.split(",").filter(function(x){return C[x];});
    if(k==="m"&&v==="or") applied.mode="OR";
  });
  elP.value=applied.product;
  pick.feature=applied.features.slice();
  pick.cert=applied.certs.slice();
  var r=elForm.querySelector('input[name="pt-mode"][value="'+applied.mode+'"]'); if(r) r.checked=true;
  if(applied.product||applied.features.length||applied.certs.length) setCollapsed(true);
}
function setCollapsed(v){ collapsed=v; root.classList.toggle("is-collapsed",v); }

elForm.addEventListener("change",syncFields);

elForm.addEventListener("submit",function(e){
  e.preventDefault();
  closeAllDD();
  applied.product=elP.value;
  applied.features=pick.feature.slice();
  applied.certs=pick.cert.slice();
  var r=elForm.querySelector('input[name="pt-mode"]:checked');
  applied.mode=r?r.value:"AND";
  page=1;
  /* 指定了品項就直接看那一雙的明細 */
  if(applied.product){ view="detail"; detailId=applied.product; dTab="spec"; }
  else { view="cards"; detailId=""; }
  setCollapsed(true);
  render(); writeHash();
});

$("pt-reset").addEventListener("click",function(){
  elP.value=""; pick={feature:[],cert:[]};
  var r=elForm.querySelector('input[name="pt-mode"][value="AND"]'); if(r) r.checked=true;
  applied={product:"",features:[],certs:[],mode:"AND"};
  view="cards"; detailId=""; page=1;
  setCollapsed(false);
  syncFields(); render(); writeHash();
});

elToggle.addEventListener("click",function(){ setCollapsed(!collapsed); render(); });

elView.addEventListener("click",function(){
  if(view==="cards"){ view="compare"; cTab="spec"; page=1; }
  else { view="cards"; detailId=""; page=1; }
  render();
});

elPills.addEventListener("click",function(e){
  var b=e.target.closest("[data-rm]");
  if(!b) return;
  var kind=b.getAttribute("data-rm"), id=b.getAttribute("data-id");
  if(kind==="p"){ applied.product=""; elP.value=""; }
  if(kind==="f"){ applied.features=applied.features.filter(function(x){return x!==id;}); }
  if(kind==="c"){ applied.certs=applied.certs.filter(function(x){return x!==id;}); }
  pick.feature=applied.features.slice(); pick.cert=applied.certs.slice();
  page=1; view="cards"; detailId="";
  syncFields(); render(); writeHash();
});

elRes.addEventListener("click",function(e){
  var pg=e.target.closest("[data-pg]");
  if(pg&&!pg.disabled){ page+= pg.getAttribute("data-pg")==="next"?1:-1; render(); return; }

  var dt=e.target.closest("[data-dtab]");
  if(dt){ dTab=dt.getAttribute("data-dtab"); page=1; render(); return; }

  var ct=e.target.closest("[data-ctab]");
  if(ct){ cTab=ct.getAttribute("data-ctab"); page=1; render(); return; }

  var cert=e.target.closest("[data-cert]");
  if(cert){ var c=C[cert.getAttribute("data-cert")]; if(c){ elLbImg.src=c.img; elLbImg.alt=c.name; elLb.hidden=false; } return; }

  if(e.target.closest(".pt-cchk")||e.target.closest(".pt-rowchk")||e.target.closest("a")) return;
  var t=e.target.closest("[data-open]");
  if(!t) return;
  detailId=t.getAttribute("data-open"); view="detail"; dTab="spec"; page=1;
  render();
});

elRes.addEventListener("change",function(e){
  var cb=e.target;
  if(!cb.hasAttribute||!cb.hasAttribute("data-cmp")) return;
  var id=cb.getAttribute("data-cmp");
  if(cb.checked){
    if(compare.length>=maxCompare()){ cb.checked=false; return; }
    compare.push(id);
  } else {
    compare=compare.filter(function(x){return x!==id;});
  }
  syncBar();
});

elLb.addEventListener("click",function(){ elLb.hidden=true; });

document.addEventListener("keydown",function(e){
  if(e.key!=="Escape") return;
  if(!elLb.hidden){ elLb.hidden=true; return; }
  closeAllDD();
  if(view!=="cards"){ view="cards"; detailId=""; page=1; render(); }
});

var rzT=null;
window.addEventListener("resize",function(){
  clearTimeout(rzT);
  rzT=setTimeout(function(){
    if(compare.length>maxCompare()) compare=compare.slice(0,maxCompare());
    render();
  },150);
});

readHash();
syncFields();
render();
window.addEventListener("load",render);
})();
</script>

</body>
</html>

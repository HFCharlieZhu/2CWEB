<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PATRONI 安全鞋規格查詢</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Sans:wght@400;500;700&display=swap">
</head>
<body style="margin:0;background:#ffffff;overflow:hidden">

<style>
/* 設計參數對齊 patroni.com.tw/pages/blog 的卡片系統 */
#pt-finder{
  --pt-brand:#f8b500;
  --pt-brand-d:#d39a00;
  --pt-ink:#111111;
  --pt-body:#666666;
  --pt-muted:#9fa0a0;
  --pt-line:#bababa;
  --pt-hair:#d8d6d0;
  --pt-paper:#ffffff;
  --pt-tint:#f5f5f5;
  --pt-media:#efefef;
  --pt-bw:1.2px;
  --pt-r:8px;
  --pt-shadow:4px 4px 6px rgba(0,0,0,.15);
  --pt-ease:.25s;
  --pt-sans:'Noto Sans','Noto Sans TC',system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;

  all:initial;
  display:block; box-sizing:border-box;
  font-family:var(--pt-sans);
  font-size:16px; line-height:1.8; letter-spacing:.03em;
  color:var(--pt-ink); background:var(--pt-paper);
  -webkit-font-smoothing:antialiased;
  padding:16px clamp(16px,2.2vw,24px);
  overflow:hidden;
}
#pt-finder *,#pt-finder *::before,#pt-finder *::after{box-sizing:border-box;}
#pt-finder .pt-wrap{max-width:1120px;margin:0 auto;}

#pt-finder .pt-scrollx{
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-ms-overflow-style:none;
  -webkit-overflow-scrolling:touch;
}
#pt-finder .pt-scrollx::-webkit-scrollbar{display:none;}
#pt-finder .pt-scrollx.is-ovf{cursor:grab;}
#pt-finder .pt-scrollx.is-fr:not(.is-fl){
  -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 16px),transparent 100%);
  mask-image:linear-gradient(90deg,#000 calc(100% - 16px),transparent 100%);
}
#pt-finder .pt-scrollx.is-fl:not(.is-fr){
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16px);
  mask-image:linear-gradient(90deg,transparent 0,#000 16px);
}
#pt-finder .pt-scrollx.is-fl.is-fr{
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 16px),transparent 100%);
  mask-image:linear-gradient(90deg,transparent 0,#000 16px,#000 calc(100% - 16px),transparent 100%);
}
#pt-finder .pt-scrollx.is-drag{cursor:grabbing;}

/* ---------- 查詢面板 ---------- */
#pt-finder .pt-panel{
  border:var(--pt-bw) solid var(--pt-line);border-radius:var(--pt-r);
  padding:16px;margin-bottom:10px;
}
#pt-finder.is-collapsed .pt-panel{display:none;}
#pt-finder .pt-fields{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:end;}
#pt-finder .pt-field{min-width:0;transition:opacity var(--pt-ease);}
#pt-finder .pt-field.is-off{opacity:.35;pointer-events:none;}
#pt-finder .pt-field>label,#pt-finder .pt-field>span.pt-lab{
  display:block;font-size:12px;font-weight:700;letter-spacing:.36px;
  color:var(--pt-body);margin-bottom:7px;
}
#pt-finder .pt-or{font-size:13.5px;color:var(--pt-body);padding-bottom:12px;letter-spacing:.06em;}

#pt-finder select,#pt-finder .pt-dd-btn{
  width:100%;font-family:var(--pt-sans);font-size:15px;line-height:1.5;
  color:var(--pt-ink);background:var(--pt-paper);
  border:var(--pt-bw) solid var(--pt-line);border-radius:var(--pt-r);
  padding:10px 13px;letter-spacing:.02em;
  outline:none;transition:border-color var(--pt-ease);
}
#pt-finder select{
  appearance:none;-webkit-appearance:none;padding-right:36px;
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 11 7' fill='none'%3E%3Cpath d='M1 1l4.5 4.5L10 1' stroke='%23111111' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 13px center;background-size:11px 7px;
}
#pt-finder select:focus,#pt-finder .pt-dd-btn[aria-expanded="true"]{border-color:var(--pt-brand);}

#pt-finder .pt-dd{position:relative;}
#pt-finder .pt-dd-btn{display:flex;align-items:center;gap:8px;text-align:left;cursor:pointer;}
#pt-finder .pt-dd-txt{flex:1 1 auto;min-width:0;overflow:hidden;white-space:nowrap;}
#pt-finder .pt-dd-btn.is-empty .pt-dd-txt{color:var(--pt-body);}
#pt-finder .pt-dd-n{
  flex:0 0 auto;font-size:12px;font-weight:700;line-height:1;
  background:var(--pt-brand);color:var(--pt-ink);border-radius:999px;padding:5px 9px;
}
#pt-finder .pt-dd-n[hidden]{display:none;}
#pt-finder .pt-dd-caret{flex:0 0 auto;width:11px;height:7px;transition:transform var(--pt-ease);}
#pt-finder .pt-dd-btn[aria-expanded="true"] .pt-dd-caret{transform:rotate(180deg);}
#pt-finder .pt-dd-panel{
  position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:40;
  background:var(--pt-paper);border:var(--pt-bw) solid var(--pt-brand);border-radius:var(--pt-r);
  max-height:min(340px,56vh);overflow-y:auto;padding:5px;
  box-shadow:var(--pt-shadow);
}
#pt-finder .pt-dd-panel[hidden]{display:none;}
#pt-finder .pt-dd-grp{
  font-size:11px;font-weight:700;letter-spacing:.13em;color:var(--pt-muted);
  padding:9px 11px 5px;
}
#pt-finder .pt-dd-opt{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:var(--pt-r);cursor:pointer;font-size:14.5px;line-height:1.4;}
#pt-finder .pt-dd-opt[aria-selected="true"]{background:var(--pt-brand);font-weight:700;}
#pt-finder .pt-dd-box{
  flex:0 0 auto;width:16px;height:16px;border:1px solid var(--pt-line);
  border-radius:999px;display:flex;align-items:center;justify-content:center;background:var(--pt-paper);
}
#pt-finder .pt-dd-box svg{width:9px;height:7px;opacity:0;}
#pt-finder .pt-dd-opt[aria-selected="true"] .pt-dd-box{background:var(--pt-ink);border-color:var(--pt-ink);}
#pt-finder .pt-dd-opt[aria-selected="true"] .pt-dd-box svg{opacity:1;}
#pt-finder .pt-dd-code{margin-left:auto;font-size:11.5px;color:var(--pt-muted);letter-spacing:.04em;flex:0 0 auto;}
#pt-finder .pt-dd-opt[aria-selected="true"] .pt-dd-code{color:var(--pt-ink);}

#pt-finder .pt-foot{
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  margin-top:14px;padding-top:12px;border-top:var(--pt-bw) solid var(--pt-hair);
}
#pt-finder .pt-logic{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
#pt-finder .pt-logic.is-off{opacity:.35;pointer-events:none;}
#pt-finder .pt-radio{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer;}
#pt-finder .pt-radio input{
  appearance:none;-webkit-appearance:none;margin:0;
  width:16px;height:16px;border-radius:50%;position:relative;
  border:1.4px solid var(--pt-line);background:var(--pt-paper);cursor:pointer;
  transition:border-color .18s ease;
}
#pt-finder .pt-radio input:checked{border-color:var(--pt-brand-d);}
#pt-finder .pt-radio input:checked::after{
  content:"";position:absolute;inset:2.6px;border-radius:50%;background:var(--pt-brand);
}
#pt-finder .pt-acts{display:flex;align-items:center;gap:10px;}

/* 按鈕：比照部落格分類膠囊 999px / 8px 20px / 16px 700 / 字距 .64px */
#pt-finder .pt-btn{
  font-family:var(--pt-sans);font-size:16px;font-weight:700;letter-spacing:.64px;line-height:1.35;
  border-radius:999px;padding:8px 20px;cursor:pointer;white-space:nowrap;
  border:1px solid var(--pt-brand);background:var(--pt-brand);color:var(--pt-ink);
  transition:background-color var(--pt-ease),color var(--pt-ease),border-color var(--pt-ease),transform var(--pt-ease);
}
#pt-finder .pt-btn--ghost{border-color:var(--pt-ink);background:transparent;color:var(--pt-ink);}
#pt-finder .pt-btn--ghost.is-active{background:var(--pt-ink);color:var(--pt-paper);}
#pt-finder .pt-btn[disabled]{opacity:.3;cursor:not-allowed;}
#pt-finder .pt-btn--sm{padding:7px 16px;font-size:13px;letter-spacing:.52px;}

/* ---------- 狀態列 ---------- */
#pt-finder .pt-bar{display:flex;align-items:center;gap:10px;margin-bottom:10px;min-height:38px;}
#pt-finder .pt-toggle{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;
  font-family:var(--pt-sans);font-size:13px;font-weight:700;letter-spacing:.52px;line-height:1;
  border:1px solid var(--pt-line);background:var(--pt-paper);color:var(--pt-ink);
  border-radius:999px;padding:10px 16px;cursor:pointer;transition:border-color var(--pt-ease);
}
#pt-finder .pt-toggle svg{width:11px;height:7px;transition:transform var(--pt-ease);}
#pt-finder:not(.is-collapsed) .pt-toggle svg{transform:rotate(180deg);}
#pt-finder .pt-count{flex:0 0 auto;font-size:13px;color:var(--pt-body);letter-spacing:.36px;white-space:nowrap;}
#pt-finder .pt-count b{font-size:18px;font-weight:700;color:var(--pt-ink);letter-spacing:0;}
#pt-finder .pt-pills{flex:1 1 auto;min-width:0;display:flex;gap:6px;align-items:center;}
#pt-finder .pt-pill{
  display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;
  font-size:12.5px;font-weight:700;line-height:1;letter-spacing:.52px;
  padding:7px 9px 7px 13px;border-radius:999px;
  background:var(--pt-brand);color:var(--pt-ink);
}
#pt-finder .pt-pill.pt-plain{background:var(--pt-tint);color:var(--pt-body);font-weight:400;padding:7px 13px;}
#pt-finder .pt-pill button{
  border:0;background:none;cursor:pointer;color:inherit;font-family:var(--pt-sans);
  font-size:14px;line-height:1;padding:0 2px;
}
#pt-finder .pt-barbtns{flex:0 0 auto;margin-left:auto;display:flex;align-items:center;gap:10px;}
#pt-finder .pt-limit{font-size:12px;color:var(--pt-body);white-space:nowrap;letter-spacing:.36px;}
#pt-finder .pt-limit[hidden]{display:none;}

#pt-finder #pt-results{overflow:hidden;}

/* ---------- 卡片 ---------- */
#pt-finder .pt-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));
  gap:14px;align-content:start;grid-auto-rows:1fr;padding:6px 12px 12px 6px;
}
#pt-finder .pt-card{
  display:flex;flex-direction:column;position:relative;background:var(--pt-paper);
  border:var(--pt-bw) solid var(--pt-line);border-radius:var(--pt-r);
  overflow:hidden;cursor:pointer;
  transition:border-color var(--pt-ease),transform var(--pt-ease),box-shadow var(--pt-ease);
}
#pt-finder .pt-card:active{border-color:var(--pt-brand);}
#pt-finder .pt-cthumb{background:var(--pt-media);aspect-ratio:1020/600;flex:0 0 auto;overflow:hidden;}
#pt-finder .pt-cthumb img{width:100%;height:100%;object-fit:contain;display:block;transform:scale(1.2);}
#pt-finder .pt-cchk{
  position:absolute;top:9px;left:9px;z-index:2;display:flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.94);border:1px solid var(--pt-line);
  border-radius:999px;padding:5px 11px;font-size:11.5px;font-weight:700;letter-spacing:.36px;cursor:pointer;
}
#pt-finder .pt-cchk input{margin:0;accent-color:var(--pt-brand);width:14px;height:14px;cursor:pointer;}
#pt-finder .pt-cbody{flex:0 0 auto;padding:12px 15px 15px;display:flex;flex-direction:column;gap:8px;min-width:0;}
#pt-finder .pt-card .pt-btn{width:100%;margin-top:auto;padding:9px 12px;position:relative;z-index:1;font-size:14px;}

#pt-finder .pt-card.is-dim::after{content:"";position:absolute;inset:0;z-index:3;background:rgba(255,255,255,.66);}
#pt-finder .pt-card.is-dim .pt-btn{z-index:4;opacity:.45;}
#pt-finder .pt-card.is-dim .pt-btn:hover{opacity:1;}

/* ---------- 橫列（手機） ---------- */
#pt-finder .pt-list{display:flex;flex-direction:column;gap:8px;}
#pt-finder .pt-row{
  display:flex;align-items:stretch;flex:0 0 auto;height:126px;
  border:var(--pt-bw) solid var(--pt-line);border-radius:var(--pt-r);
  overflow:hidden;cursor:pointer;transition:border-color var(--pt-ease);
}
#pt-finder .pt-row:active{border-color:var(--pt-brand);}
#pt-finder .pt-rowchk{
  flex:0 0 auto;display:flex;align-items:center;padding:0 9px;
  background:var(--pt-media);cursor:pointer;
}
#pt-finder .pt-rowchk input{margin:0;accent-color:var(--pt-brand);width:17px;height:17px;cursor:pointer;}
#pt-finder .pt-rowimg{flex:0 0 auto;width:104px;background:var(--pt-media);overflow:hidden;}
#pt-finder .pt-rowimg img{width:100%;height:100%;object-fit:contain;display:block;transform:scale(1.2);}
#pt-finder .pt-rowmain{
  flex:1 1 auto;min-width:0;display:flex;flex-direction:column;justify-content:center;
  gap:6px;padding:9px 12px;
}
#pt-finder .pt-row.is-dim{position:relative;}
#pt-finder .pt-row.is-dim::after{content:"";position:absolute;inset:0;z-index:3;background:rgba(255,255,255,.66);}

#pt-finder .pt-name{
  font-size:16px;font-weight:700;line-height:1.4;margin:0;letter-spacing:.02em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

#pt-finder .pt-model{font-size:12px;font-weight:700;letter-spacing:.36px;color:var(--pt-body);}
#pt-finder .pt-tags{display:flex;align-items:center;gap:7px;flex-wrap:nowrap;min-width:0;min-height:38px;padding:0;}
#pt-finder .pt-tag{
  flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;line-height:1.35;letter-spacing:.52px;
  padding:6px 14px;border-radius:999px;
  background:var(--pt-tint);border:1px solid var(--pt-line);color:var(--pt-body);
  white-space:nowrap;user-select:none;
}
#pt-finder .pt-tag.pt-cert{background:var(--pt-paper);color:var(--pt-ink);}
#pt-finder .pt-tag.pt-hit{background:var(--pt-brand);border-color:var(--pt-brand);color:var(--pt-ink);}

#pt-finder .pt-pager{display:flex;align-items:center;justify-content:center;gap:14px;height:46px;}
#pt-finder .pt-pg{
  font-family:var(--pt-sans);font-size:13px;font-weight:700;letter-spacing:.52px;line-height:1;
  border:1px solid var(--pt-ink);background:transparent;color:var(--pt-ink);
  border-radius:999px;padding:9px 18px;cursor:pointer;
  transition:background-color var(--pt-ease),color var(--pt-ease);
}
#pt-finder .pt-pg[disabled]{opacity:.25;cursor:not-allowed;}
#pt-finder .pt-pgnum{font-size:13px;color:var(--pt-body);letter-spacing:.52px;min-width:6.5em;text-align:center;}
#pt-finder .pt-pgnum b{color:var(--pt-ink);}
#pt-finder .pt-pager.is-off{visibility:hidden;}

#pt-finder .pt-empty{
  border:var(--pt-bw) dashed var(--pt-line);border-radius:var(--pt-r);
  padding:36px 20px;text-align:center;color:var(--pt-body);font-size:14px;
}

/* ---------- 明細 ---------- */
#pt-finder .pt-dhead{display:flex;align-items:center;gap:16px;margin-bottom:12px;}
#pt-finder .pt-dimg{flex:0 0 auto;width:204px;aspect-ratio:1020/600;background:var(--pt-media);border-radius:var(--pt-r);overflow:hidden;}
#pt-finder .pt-dimg img{width:100%;height:100%;object-fit:contain;display:block;transform:scale(1.2);}
#pt-finder .pt-dmeta{flex:1 1 auto;min-width:0;}
#pt-finder .pt-dmeta h3{font-size:19px;font-weight:700;line-height:1.4;margin:0 0 1px;letter-spacing:.02em;}
#pt-finder .pt-dmeta .pt-sub{font-size:12px;color:var(--pt-body);letter-spacing:.36px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

#pt-finder .pt-tabs{display:flex;gap:6px;border-bottom:var(--pt-bw) solid var(--pt-hair);margin-bottom:10px;}
#pt-finder .pt-tab{
  font-family:var(--pt-sans);font-size:13.5px;font-weight:700;letter-spacing:.52px;
  border:0;background:none;color:var(--pt-muted);cursor:pointer;
  padding:9px 13px;border-bottom:2.5px solid transparent;margin-bottom:calc(var(--pt-bw) * -1);
  transition:color var(--pt-ease),border-color var(--pt-ease);
}
#pt-finder .pt-tab[aria-selected="true"]{color:var(--pt-ink);border-bottom-color:var(--pt-brand);}
#pt-finder .pt-shopwrap{display:flex;justify-content:flex-end;margin-top:12px;}
#pt-finder .pt-shopwrap a{text-decoration:none;}

#pt-finder table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:14px;}
#pt-finder th,#pt-finder td{border-bottom:1px solid var(--pt-hair);padding:0 10px;height:38px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#pt-finder thead th{background:var(--pt-tint);font-size:12.5px;font-weight:700;letter-spacing:.52px;color:var(--pt-ink);height:42px;}
#pt-finder th:first-child,#pt-finder td:first-child{text-align:left;color:var(--pt-body);font-weight:500;}
#pt-finder .pt-cmpt th,#pt-finder .pt-cmpt td{white-space:normal;word-break:break-word;line-height:1.4;padding:9px 10px;height:auto;text-overflow:clip;}
#pt-finder .pt-spec td:last-child{text-align:left;color:var(--pt-ink);white-space:normal;}
#pt-finder .pt-spec th{width:6.4em;font-size:13px;}
#pt-finder .pt-dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--pt-brand);}
#pt-finder .pt-none{color:var(--pt-hair);}

#pt-finder .pt-flist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:0 14px;}
#pt-finder .pt-flist li{display:flex;gap:9px;align-items:center;height:36px;font-size:13.5px;white-space:nowrap;}
#pt-finder .pt-fc{
  flex:0 0 auto;font-size:11px;font-weight:700;letter-spacing:.52px;
  padding:4px 11px;border-radius:999px;background:var(--pt-tint);
  border:1px solid var(--pt-line);color:var(--pt-body);
}
#pt-finder .pt-flist li.pt-hit .pt-fc{background:var(--pt-brand);border-color:var(--pt-brand);color:var(--pt-ink);}
#pt-finder .pt-flist li.pt-hit>span:last-child{font-weight:700;}

#pt-finder .pt-clist{display:flex;flex-direction:column;gap:8px;}
#pt-finder .pt-crow{
  display:flex;align-items:center;gap:12px;height:70px;width:100%;
  border:var(--pt-bw) solid var(--pt-line);border-radius:var(--pt-r);overflow:hidden;
  background:none;padding:0;cursor:zoom-in;text-align:left;font-family:var(--pt-sans);
  transition:border-color var(--pt-ease);
}
#pt-finder .pt-crow img{flex:0 0 auto;width:94px;height:100%;object-fit:cover;background:var(--pt-media);}
#pt-finder .pt-cmeta{min-width:0;}
#pt-finder .pt-cmeta b{display:block;font-size:14px;font-weight:700;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--pt-ink);}
#pt-finder .pt-cmeta span{display:block;font-size:12px;color:var(--pt-body);letter-spacing:.36px;}

/* ---------- 認證燈箱：白底、靠上、圖縮 40% ---------- */
#pt-finder .pt-lb{
  position:fixed;inset:0;z-index:200;display:flex;align-items:flex-start;justify-content:center;
  background:var(--pt-paper);padding:64px 16px 16px;
}
#pt-finder .pt-lb[hidden]{display:none;}
#pt-finder .pt-lb img{max-width:60%;max-height:60%;object-fit:contain;display:block;}
#pt-finder .pt-lbx{
  position:absolute;top:14px;right:16px;width:58px;height:58px;border-radius:50%;
  background:var(--pt-tint);border:1px solid var(--pt-line);color:var(--pt-ink);
  font-family:var(--pt-sans);font-size:30px;line-height:1;cursor:pointer;
  transition:background-color var(--pt-ease),color var(--pt-ease),border-color var(--pt-ease),transform var(--pt-ease);
}

/* 只有真的有滑鼠的裝置才套 hover，手機點下去不會殘留 */
@media (hover:hover) and (pointer:fine){
  #pt-finder .pt-card:hover{
    transform:scale(1.02);box-shadow:var(--pt-shadow);border-color:var(--pt-brand);
  }
  #pt-finder .pt-card.is-dim:hover{transform:none;box-shadow:none;border-color:var(--pt-line);}
  #pt-finder .pt-row:hover{border-color:var(--pt-brand);}
  #pt-finder .pt-crow:hover{border-color:var(--pt-brand);}
  #pt-finder select:hover,#pt-finder .pt-dd-btn:hover{border-color:var(--pt-brand);}
  #pt-finder .pt-toggle:hover{border-color:var(--pt-brand);}
  #pt-finder .pt-dd-opt:hover{background:var(--pt-tint);}
  #pt-finder .pt-dd-opt[aria-selected="true"]:hover{background:var(--pt-brand);}
  /* 主按鈕放大，次級只換底色 */
  #pt-finder .pt-btn:hover{transform:scale(1.08);}
  #pt-finder .pt-card .pt-btn:hover,
  #pt-finder .pt-shopwrap .pt-btn:hover{transform:none;filter:brightness(.94);}

/* 橫向拖曳瀏覽；拖曳後 250ms 內不接受點按，避免誤觸展開 */
function bindScrollX(el){
  markOvf(el);
  if(el.dataset.sx) return;
  el.dataset.sx="1";
  var down=false,moved=false,x0=0,s0=0,until=0;
  el.addEventListener("pointerdown",function(e){
    if(el.scrollWidth-el.clientWidth<=2) return;
    down=true;moved=false;x0=e.clientX;s0=el.scrollLeft;el.classList.add("is-drag");
  });
  el.addEventListener("pointermove",function(e){
    if(!down) return;
    var d=e.clientX-x0;
    if(Math.abs(d)>3){ moved=true; el.scrollLeft=s0-d; e.preventDefault(); }
  });
  function up(){
    if(!down) return;
    down=false; el.classList.remove("is-drag");
    if(moved){ until=Date.now()+250; el.dataset.until=until; }
  }
  el.addEventListener("pointerup",up);
  el.addEventListener("pointercancel",up);
  el.addEventListener("pointerleave",up);
  el.addEventListener("scroll",function(){ markOvf(el); },{passive:true});
}
function markOvf(el){
  var max=el.scrollWidth-el.clientWidth, ovf=max>2;
  el.classList.toggle("is-ovf",ovf);
  el.classList.toggle("is-fl", ovf && el.scrollLeft>2);
  el.classList.toggle("is-fr", ovf && el.scrollLeft<max-2);
}
function justDragged(node){
  var el=node&&node.closest?node.closest(".pt-scrollx"):null;

function matches(p){
  if(applied.product && p.id!==applied.product) return false;
  if(applied.sel.length){
    var ok=applied.mode==="AND"
      ? applied.sel.every(function(k){return has(p,k);})
      : applied.sel.some(function(k){return has(p,k);});
    if(!ok) return false;
  }
  return true;
}
function results(){ return PRODUCTS.filter(matches); }
function isHitF(id){ return applied.sel.indexOf("f:"+id)>=0; }
function isHitC(id){ return applied.sel.indexOf("c:"+id)>=0; }

function syncBar(){
  elHead.innerHTML='符合 <b>'+results().length+'</b> 項';

  var cs=[];
  if(applied.product) cs.push(['p','',P[applied.product]?P[applied.product].name+" "+applied.product:applied.product]);
  applied.sel.forEach(function(k){ if(OPTMAP[k]) cs.push(['s',k,OPTMAP[k].name]); });
  elPills.innerHTML = cs.length
    ? cs.map(function(x){
        return '<span class="pt-pill">'+esc(x[2])+'<button type="button" data-rm="'+x[0]+'" data-id="'+esc(x[1])+'" aria-label="移除">&times;</button></span>';
      }).join("")
    : '<span class="pt-pill pt-plain">未設條件</span>';

  var full=compare.length>=maxCompare();
  elLimit.hidden=!full;
  elLimit.textContent="上限："+maxCompare();

  if(view==="detail"||view==="compare"){
    elView.textContent = view==="detail" ? "返回列表" : "關閉比較";
    elView.disabled=false; elView.classList.add("is-active");
  } else {
    elView.textContent = compare.length>=2 ? "比較 ("+compare.length+")" : "比較";
    elView.disabled = compare.length<2; elView.classList.remove("is-active");
  }
}

function availH(){
  var top=elRes.getBoundingClientRect().top-root.getBoundingClientRect().top;
  var pad=parseFloat(getComputedStyle(root).paddingBottom)||16;
  return Math.max(0,(window.innerHeight||600)-top-pad);
}
function pagerHTML(page,pages){
  return '<div class="pt-pager'+(pages>1?"":" is-off")+'">'+
    '<button type="button" class="pt-pg" data-pg="prev"'+(page<=1?" disabled":"")+'>上一頁</button>'+
    '<span class="pt-pgnum">第 <b>'+page+'</b> / '+pages+' 頁</span>'+
    '<button type="button" class="pt-pg" data-pg="next"'+(page>=pages?" disabled":"")+'>下一頁</button></div>';
}
function shopHTML(p){
  return p.url ? '<div class="pt-shopwrap"><a class="pt-btn pt-btn--sm" href="'+esc(p.url)+'" target="_blank" rel="noopener">商品頁</a></div>' : '';
}

function render(){
  syncBar();
  elRes.style.display="";
  var H=availH();
  if(H<96){ elRes.style.display="none"; return; }
  elRes.style.height=H+"px";
  if(view==="detail") renderDetail(H);
  else if(view==="compare") renderCompare(H);
  else renderCards(H);
  bindAllScrollX();
}

function tagStrip(p){
  var fs=p.features.slice().sort(function(a,b){return (isHitF(b)?1:0)-(isHitF(a)?1:0);});
  var cs=p.certs.slice().sort(function(a,b){return (isHitC(b)?1:0)-(isHitC(a)?1:0);});
  return '<div class="pt-tags pt-scrollx">'+
      cs.map(function(id){ return '<span class="pt-tag pt-cert'+(isHitC(id)?" pt-hit":"")+'">'+esc(C[id].name)+'</span>';}).join("")+
    '</div>'+
    '<div class="pt-tags pt-scrollx">'+
      fs.map(function(id){ return '<span class="pt-tag'+(isHitF(id)?" pt-hit":"")+'">'+esc(F[id].name)+'</span>';}).join("")+
    '</div>';
}
function dimClass(id){
  return (compare.length>=maxCompare() && compare.indexOf(id)<0) ? " is-dim" : "";
}
function cardHTML(p){
  return '<article class="pt-card'+dimClass(p.id)+'" data-open="'+p.id+'">'+
    '<label class="pt-cchk"><input type="checkbox" data-cmp="'+p.id+'"'+(compare.indexOf(p.id)>=0?" checked":"")+(dimClass(p.id)?" disabled":"")+' aria-label="加入比較">比較</label>'+
    '<div class="pt-cthumb"><img src="'+esc(p.img)+'" alt="'+esc(p.name)+'" loading="lazy"></div>'+
    '<div class="pt-cbody">'+
      '<h4 class="pt-name">'+esc(p.name)+' <span class="pt-model">'+esc(p.id)+'</span></h4>'+
      tagStrip(p)+
      '<button type="button" class="pt-btn" data-open="'+p.id+'">展開</button>'+
    '</div></article>';
}
function rowHTML(p){
  return '<article class="pt-row'+dimClass(p.id)+'" data-open="'+p.id+'">'+
    '<label class="pt-rowchk"><input type="checkbox" data-cmp="'+p.id+'"'+(compare.indexOf(p.id)>=0?" checked":"")+(dimClass(p.id)?" disabled":"")+' aria-label="加入比較"></label>'+
    '<div class="pt-rowimg"><img src="'+esc(p.img)+'" alt="'+esc(p.name)+'" loading="lazy"></div>'+
    '<div class="pt-rowmain">'+
      '<h4 class="pt-name">'+esc(p.name)+' <span class="pt-model">'+esc(p.id)+'</span></h4>'+
      tagStrip(p)+
    '</div></article>';
}

function renderCards(H){
  var list=results();
  if(!list.length){
    elRes.innerHTML='<div class="pt-empty">查無符合條件的品項</div>';
    return;
  }
  var space=H-PAGER_H, per=0, cards=false;

  if(useCards()){
    elRes.innerHTML='<div class="pt-grid">'+cardHTML(list[0])+'</div>';
    var grid=elRes.firstChild, one=grid.firstElementChild;
    var pad=18; /* 網格上下內距，留給放大與陰影 */
    if(one.offsetHeight+pad<=space){
      var cols=getComputedStyle(grid).gridTemplateColumns.split(" ").filter(Boolean).length;
      per=Math.min(CARDS_PER_PAGE, cols*Math.max(1,Math.floor((space-pad+GAP)/(one.offsetHeight+GAP))));
      cards=true;
    }
  }
  if(!cards){
    var rowH=126+ROW_GAP;
    if(space<126){ elRes.style.display="none"; return; }
    per=Math.max(1,Math.floor((space+ROW_GAP)/rowH));
  }

  var pages=Math.max(1,Math.ceil(list.length/per));
  page=Math.min(Math.max(1,page),pages);
  var shown=list.slice((page-1)*per,(page-1)*per+per);

  if(cards){
    elRes.innerHTML='<div class="pt-grid">'+shown.map(cardHTML).join("")+'</div>'+pagerHTML(page,pages);
  } else {
    elRes.innerHTML='<div class="pt-list">'+shown.map(rowHTML).join("")+'</div>'+pagerHTML(page,pages);
  }
}

function renderDetail(H){
  var p=P[detailId];
  if(!p){ view="cards"; renderCards(H); return; }

  elRes.innerHTML='<div class="pt-dhead">'+
      '<div class="pt-dimg"><img src="'+esc(p.img)+'" alt="'+esc(p.name)+'"></div>'+
      '<div class="pt-dmeta">'+
        '<h3>'+esc(p.name)+' <span class="pt-model">'+esc(p.id)+'</span></h3>'+
        '<div class="pt-sub">'+esc(p.series)+'</div></div>'+
    '</div>'+
    '<div class="pt-tabs" role="tablist">'+
      '<button type="button" class="pt-tab" data-dtab="spec" role="tab" aria-selected="'+(dTab==="spec")+'">規格</button>'+
      '<button type="button" class="pt-tab" data-dtab="feat" role="tab" aria-selected="'+(dTab==="feat")+'">功能 '+p.features.length+'</button>'+
      '<button type="button" class="pt-tab" data-dtab="cert" role="tab" aria-selected="'+(dTab==="cert")+'">認證 '+p.certs.length+'</button>'+
    '</div><div id="pt-tabbody"></div>';

  var body=$("pt-tabbody");
  var avail=H-(body.getBoundingClientRect().top-elRes.getBoundingClientRect().top)-PAGER_H-SHOP_H;

  if(dTab==="spec"){
    var perS=Math.max(1,Math.floor(avail/38));
    var pagesS=Math.max(1,Math.ceil(SPEC_ROWS.length/perS));
    page=Math.min(Math.max(1,page),pagesS);
    body.innerHTML='<table class="pt-spec"><tbody>'+
      SPEC_ROWS.slice((page-1)*perS,(page-1)*perS+perS).map(function(r){
        return '<tr><th>'+esc(r[1])+'</th><td>'+esc(p.spec[r[0]]||"—")+'</td></tr>';}).join("")+
      '</tbody></table>'+shopHTML(p)+pagerHTML(page,pagesS);
    return;
  }
  if(dTab==="feat"){
    var lineH=narrow()?34:36;
    var cols=narrow()?2:Math.max(1,Math.floor(elRes.clientWidth/192));
    var perF=Math.max(cols,cols*Math.floor(avail/lineH));
    var pagesF=Math.max(1,Math.ceil(p.features.length/perF));
    page=Math.min(Math.max(1,page),pagesF);
    body.innerHTML='<ul class="pt-flist">'+
      p.features.slice((page-1)*perF,(page-1)*perF+perF).map(function(fid){
        var f=F[fid]; if(!f) return "";
        return '<li class="'+(isHitF(fid)?"pt-hit":"")+'"><span class="pt-fc">'+esc(f.code||"·")+'</span><span>'+esc(f.name)+'</span></li>';
      }).join("")+'</ul>'+shopHTML(p)+pagerHTML(page,pagesF);
    return;
  }
  var rowH=(narrow()?62:70)+8;
  var perC=Math.max(1,Math.floor(avail/rowH));
  var pagesC=Math.max(1,Math.ceil(p.certs.length/perC));
  page=Math.min(Math.max(1,page),pagesC);
  body.innerHTML='<div class="pt-clist">'+
    p.certs.slice((page-1)*perC,(page-1)*perC+perC).map(function(cid){
      var c=C[cid]; if(!c) return "";
      return '<button type="button" class="pt-crow'+(isHitC(cid)?" pt-hit":"")+'" data-cert="'+c.id+'">'+
        '<img src="'+esc(c.img)+'" alt="" loading="lazy">'+
        '<span class="pt-cmeta"><b>'+esc(c.name)+'</b><span>'+esc(c.note)+'</span></span></button>';
    }).join("")+'</div>'+shopHTML(p)+pagerHTML(page,pagesC);
}

function renderCompare(H){
  var ps=compare.map(function(id){return P[id];}).filter(Boolean);
  elRes.innerHTML='<div class="pt-tabs" role="tablist">'+
      '<button type="button" class="pt-tab" data-ctab="spec" role="tab" aria-selected="'+(cTab==="spec")+'">規格</button>'+
      '<button type="button" class="pt-tab" data-ctab="cert" role="tab" aria-selected="'+(cTab==="cert")+'">認證</button>'+
      '<button type="button" class="pt-tab" data-ctab="feat" role="tab" aria-selected="'+(cTab==="feat")+'">功能</button>'+
    '</div><div id="pt-tabbody"></div>';

  var body=$("pt-tabbody");
  var avail=H-(body.getBoundingClientRect().top-elRes.getBoundingClientRect().top)-PAGER_H;
  var cellH=narrow()?44:46, headH=narrow()?40:44;
  var perRow=Math.max(2,Math.floor((avail-headH)/cellH));
  var dot=function(y){return y?'<span class="pt-dot"></span>':'<span class="pt-none">—</span>';};
  var head='<thead><tr><th>項目</th>'+ps.map(function(p){
    return '<th>'+esc(p.id)+'</th>';}).join("")+'</tr></thead>';

  var rows;
  if(cTab==="spec"){
    rows=SPEC_ROWS.map(function(r){
      return '<tr><td>'+esc(r[1])+'</td>'+ps.map(function(p){
        var v=p.spec[r[0]]||"—";
        return '<td title="'+esc(v)+'">'+esc(v)+'</td>';}).join("")+'</tr>';});
  } else if(cTab==="cert"){
    rows=CERTS.filter(function(c){return ps.some(function(p){return p.certs.indexOf(c.id)>=0;});})
      .map(function(c){
        return '<tr><td>'+esc(c.name)+'</td>'+ps.map(function(p){
          return '<td>'+dot(p.certs.indexOf(c.id)>=0)+'</td>';}).join("")+'</tr>';});
  } else {
    rows=FEATURES.filter(function(f){return ps.some(function(p){return p.features.indexOf(f.id)>=0;});})
      .map(function(f){
        return '<tr><td>'+esc(f.name)+'</td>'+ps.map(function(p){
          return '<td>'+dot(p.features.indexOf(f.id)>=0)+'</td>';}).join("")+'</tr>';});
  }
  function paint(n){
    var pg=Math.max(1,Math.ceil(rows.length/n));
    page=Math.min(Math.max(1,page),pg);
    body.innerHTML='<table class="pt-cmpt">'+head+'<tbody>'+
      rows.slice((page-1)*n,(page-1)*n+n).join("")+'</tbody></table>'+pagerHTML(page,pg);
    return body.querySelector("table").getBoundingClientRect().height;
  }
  var n=Math.min(rows.length,perRow), guard=0;
  while(paint(n)>avail && n>2 && guard++<24) n--;
}

/* ---------- 網址狀態 ---------- */
function writeHash(){
  var parts=[];
  if(applied.product) parts.push("p="+applied.product);
  if(applied.sel.length) parts.push("s="+applied.sel.join(","));
  if(applied.mode!=="AND") parts.push("m=or");
  var h=parts.length?"#pt:"+parts.join("&"):"";
  if(h!==location.hash&&(h||location.hash.indexOf("#pt:")===0)){
    history.replaceState(null,"",location.pathname+location.search+h);
  }
}
function readHash(){
  if(location.hash.indexOf("#pt:")!==0) return;
  location.hash.slice(4).split("&").forEach(function(kv){
    var i=kv.indexOf("="); if(i<0) return;
    var k=kv.slice(0,i), v=decodeURIComponent(kv.slice(i+1));
    if(k==="p"&&P[v]) applied.product=v;
    if(k==="s") applied.sel=v.split(",").filter(function(x){return OPTMAP[x];});
    if(k==="m"&&v==="or") applied.mode="OR";
  });
  elP.value=applied.product;
  pick.sel=applied.sel.slice();
  var r=elForm.querySelector('input[name="pt-mode"][value="'+applied.mode+'"]'); if(r) r.checked=true;
  if(applied.product||applied.sel.length) setCollapsed(true);
}
function setCollapsed(v){
  collapsed=v;
  root.classList.toggle("is-collapsed",v);
  elToggleLb.textContent = v ? "展開「查詢」" : "收起「查詢」";
}

/* ---------- 事件 ---------- */
elForm.addEventListener("change",function(e){
  if(e.target===elP && elP.value){ pick.sel=[]; }
  syncFields();
});

elForm.addEventListener("submit",function(e){
  e.preventDefault();
  closeDD();
  applied.product=elP.value;
  applied.sel=elP.value?[]:pick.sel.slice();
  var r=elForm.querySelector('input[name="pt-mode"]:checked');
  applied.mode=r?r.value:"AND";
  compare=[];                       /* 重新查詢就清掉上一輪的勾選 */
  page=1;
  if(applied.product){ view="detail"; detailId=applied.product; dTab="spec"; }
  else { view="cards"; detailId=""; }
  setCollapsed(true);
  render(); writeHash();
});

$("pt-reset").addEventListener("click",function(){
  elP.value=""; pick.sel=[];
  var r=elForm.querySelector('input[name="pt-mode"][value="AND"]'); if(r) r.checked=true;
  applied={product:"",sel:[],mode:"AND"};
  compare=[];
  view="cards"; detailId=""; page=1;
  setCollapsed(false);
  syncFields(); render(); writeHash();
});

elToggle.addEventListener("click",function(){
  setCollapsed(!collapsed);
  if(!collapsed) syncFields();
  render();
});

elView.addEventListener("click",function(){
  if(view==="cards"){ view="compare"; cTab="spec"; page=1; }
  else { view="cards"; detailId=""; page=1; setCollapsed(false); }  /* 返回列表就打開查詢欄 */
  render();
});

elPills.addEventListener("click",function(e){
  if(justDragged(e.target)) return;
  var b=e.target.closest("[data-rm]");
  if(!b) return;
  var kind=b.getAttribute("data-rm"), id=b.getAttribute("data-id");
  if(kind==="p"){ applied.product=""; elP.value=""; }
  if(kind==="s"){ applied.sel=applied.sel.filter(function(x){return x!==id;}); }
  pick.sel=applied.sel.slice();
  page=1; view="cards"; detailId="";
  syncFields(); render(); writeHash();
});

elRes.addEventListener("click",function(e){
  var pg=e.target.closest("[data-pg]");
  if(pg&&!pg.disabled){ page+= pg.getAttribute("data-pg")==="next"?1:-1; render(); return; }

  var dt=e.target.closest("[data-dtab]");
  if(dt){ dTab=dt.getAttribute("data-dtab"); page=1; render(); return; }
  var ct=e.target.closest("[data-ctab]");
  if(ct){ cTab=ct.getAttribute("data-ctab"); page=1; render(); return; }

  var cert=e.target.closest("[data-cert]");
  if(cert){ var c=C[cert.getAttribute("data-cert")]; if(c){ elLbImg.src=c.img; elLbImg.alt=c.name; elLb.hidden=false; } return; }

  if(justDragged(e.target)) return;                       /* 剛拖曳過膠囊，不當成點按 */
  if(e.target.closest(".pt-cchk")||e.target.closest(".pt-rowchk")||e.target.closest("a")) return;
  var t=e.target.closest("[data-open]");
  if(!t) return;
  if(t.classList.contains("is-dim") && !e.target.closest(".pt-btn")) return;
  detailId=t.getAttribute("data-open"); view="detail"; dTab="spec"; page=1;
  render();
});

elRes.addEventListener("change",function(e){
  var cb=e.target;
  if(!cb.hasAttribute||!cb.hasAttribute("data-cmp")) return;
  var id=cb.getAttribute("data-cmp");
  var wasFull=compare.length>=maxCompare();
  if(cb.checked){
    if(wasFull){ cb.checked=false; return; }
    compare.push(id);
  } else {
    compare=compare.filter(function(x){return x!==id;});
  }
  if((compare.length>=maxCompare())!==wasFull) render(); else syncBar();
});

$("pt-lbx").addEventListener("click",function(e){ e.stopPropagation(); elLb.hidden=true; });
elLb.addEventListener("click",function(){ elLb.hidden=true; });

document.addEventListener("keydown",function(e){
  if(e.key!=="Escape") return;
  if(!elLb.hidden){ elLb.hidden=true; return; }
  closeDD();
  if(view!=="cards"){ view="cards"; detailId=""; page=1; setCollapsed(false); render(); }
});

var rzT=null;
window.addEventListener("resize",function(){
  var g=elRes.querySelector(".pt-grid");
  if(g){ g.style.height=""; g.style.gridTemplateRows=""; }
  clearTimeout(rzT);
  rzT=setTimeout(function(){
    if(compare.length>maxCompare()) compare=compare.slice(0,maxCompare());
    syncFields(); render();
  },160);
});

readHash();
setCollapsed(collapsed);
syncFields();
render();
window.addEventListener("load",function(){ syncFields(); render(); });
})();
</script>

</body>
</html>

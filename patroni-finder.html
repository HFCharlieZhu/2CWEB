<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PATRONI 安全鞋規格查詢</title>
</head>
<body style="margin:0;background:#eeeeee">

<!-- ============================================================
     ↓↓↓ 貼進 SHOPLINE 自訂 HTML 區塊，從這裡開始複製 ↓↓↓
     ============================================================ -->

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Sans:wght@400;500;700&display=swap">

<style>
/* 樣式全部鎖在 #pt-finder 底下，不會污染 SHOPLINE 佈景 */
#pt-finder{
  --pt-brand:#f8b500;
  --pt-ink:#111111;
  --pt-body:#6b6b6b;
  --pt-muted:#9fa0a0;
  --pt-line:#b5b5b6;
  --pt-hair:#d8d6d0;
  --pt-ground:#eeeeee;
  --pt-paper:#ffffff;
  --pt-card:#f5f5f5;
  --pt-media:#f0f0f0;
  --pt-r-card:14px;
  --pt-r-box:8px;
  --pt-sans:'Noto Sans','Noto Sans TC',system-ui,-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;

  all:initial;
  display:block; box-sizing:border-box;
  font-family:var(--pt-sans);
  font-size:15px; line-height:1.8; letter-spacing:.03em;
  color:var(--pt-ink); background:var(--pt-ground);
  -webkit-font-smoothing:antialiased;
  padding:clamp(20px,5vw,48px) clamp(16px,4vw,40px);
}
#pt-finder *,#pt-finder *::before,#pt-finder *::after{box-sizing:border-box;}
#pt-finder .pt-wrap{max-width:1120px;margin:0 auto;}

/* ---------- 標題 ---------- */
#pt-finder .pt-head{margin:0 0 24px;}
#pt-finder .pt-head h2{font-size:clamp(22px,3.4vw,30px);font-weight:700;line-height:1.3;letter-spacing:-.01em;margin:0 0 6px;}
#pt-finder .pt-head p{margin:0;color:var(--pt-body);font-size:14px;}

/* ---------- 查詢面板 ---------- */
#pt-finder .pt-panel{
  background:var(--pt-paper);border:1.2px solid var(--pt-line);
  border-radius:var(--pt-r-box);padding:clamp(16px,3vw,24px);margin-bottom:20px;
}
#pt-finder .pt-fields{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
#pt-finder .pt-field label{
  display:flex;align-items:baseline;justify-content:space-between;gap:8px;
  font-size:12px;font-weight:700;letter-spacing:.13em;
  color:var(--pt-muted);margin-bottom:8px;
}
#pt-finder .pt-cnt{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--pt-ink);}
#pt-finder .pt-cnt:empty{display:none;}
#pt-finder select{
  width:100%;font-family:var(--pt-sans);font-size:14px;line-height:1.6;
  color:var(--pt-ink);background:var(--pt-paper);
  border:1.2px solid var(--pt-line);border-radius:var(--pt-r-box);
  padding:9px 11px;letter-spacing:.02em;
  outline:none;transition:border-color .2s ease;
}
#pt-finder select:focus,#pt-finder select:hover{border-color:var(--pt-ink);}
#pt-finder select[multiple]{padding:6px;height:auto;}
#pt-finder select[multiple] option{padding:6px 9px;border-radius:5px;cursor:pointer;}
/* 選取狀態一律用品牌色，蓋掉瀏覽器的系統藍 */
#pt-finder select[multiple] option:checked,
#pt-finder select[multiple]:focus option:checked{
  background:var(--pt-brand)!important;
  background-image:linear-gradient(var(--pt-brand),var(--pt-brand))!important;
  color:var(--pt-ink)!important;font-weight:700;
}
#pt-finder option:disabled{color:var(--pt-hair);}
#pt-finder .pt-tip{font-size:11.5px;color:var(--pt-muted);margin-top:6px;letter-spacing:.02em;line-height:1.6;}
#pt-finder .pt-tip b{color:var(--pt-body);font-weight:700;}

#pt-finder .pt-foot{
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  margin-top:18px;padding-top:16px;border-top:1.2px solid var(--pt-hair);
}
#pt-finder .pt-logic{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
#pt-finder .pt-radio{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;cursor:pointer;}
#pt-finder .pt-radio input{margin:0;accent-color:var(--pt-brand);width:16px;height:16px;}
#pt-finder .pt-acts{display:flex;align-items:center;gap:12px;}
#pt-finder .pt-dirty{
  font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--pt-ink);
  background:var(--pt-brand);border-radius:999px;padding:4px 12px;white-space:nowrap;
}
#pt-finder .pt-dirty[hidden]{display:none;}
#pt-finder .pt-btn{
  font-family:var(--pt-sans);font-size:13px;font-weight:700;letter-spacing:.04em;line-height:1;
  border-radius:999px;padding:11px 26px;cursor:pointer;
  border:1.2px solid var(--pt-brand);background:var(--pt-brand);color:var(--pt-ink);
  transition:transform .25s ease,background-color .25s ease,color .25s ease,filter .25s ease;
}
#pt-finder .pt-btn:hover{filter:brightness(.94);transform:scale(1.04);}
#pt-finder .pt-btn--ghost{border-color:var(--pt-ink);background:transparent;color:var(--pt-ink);}
#pt-finder .pt-btn--ghost:hover,
#pt-finder .pt-btn--ghost.is-active{background:var(--pt-ink);color:var(--pt-paper);filter:none;}
#pt-finder .pt-btn[disabled]{opacity:.3;cursor:not-allowed;transform:none;filter:none;}

/* ---------- 結果列 ---------- */
#pt-finder .pt-bar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:14px;flex-wrap:wrap;}
#pt-finder .pt-count{font-size:13px;color:var(--pt-body);letter-spacing:.04em;}
#pt-finder .pt-count b{font-size:20px;font-weight:700;color:var(--pt-ink);letter-spacing:0;}
#pt-finder .pt-crit{font-size:12px;color:var(--pt-muted);letter-spacing:.02em;}
#pt-finder .pt-crit em{font-style:normal;color:var(--pt-ink);font-weight:700;}

/* ---------- 卡片 ---------- */
#pt-finder .pt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;}
#pt-finder .pt-card{
  position:relative;background:var(--pt-card);
  border:1.2px solid var(--pt-line);border-radius:var(--pt-r-card);
  overflow:hidden;display:flex;flex-direction:column;
  transition:border-color .25s ease,box-shadow .25s ease;
}
#pt-finder .pt-card:hover{border-color:var(--pt-ink);box-shadow:0 4px 14px rgba(0,0,0,.07);}
#pt-finder .pt-thumb{
  position:relative;background:var(--pt-media);aspect-ratio:1/1;
  border:0;padding:0;width:100%;display:block;cursor:pointer;
}
#pt-finder .pt-thumb img{width:100%;height:100%;object-fit:contain;display:block;}
#pt-finder .pt-cmp{
  position:absolute;top:10px;left:10px;z-index:2;
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.92);border:1.2px solid var(--pt-line);
  border-radius:999px;padding:5px 11px;font-size:11.5px;font-weight:700;
  letter-spacing:.04em;cursor:pointer;
}
#pt-finder .pt-cmp input{margin:0;accent-color:var(--pt-brand);width:14px;height:14px;}
#pt-finder .pt-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1;background:var(--pt-paper);}
#pt-finder .pt-model{font-size:11px;font-weight:700;letter-spacing:.13em;color:var(--pt-muted);}
#pt-finder .pt-name{font-size:16px;font-weight:700;line-height:1.4;margin:0;letter-spacing:.02em;}
#pt-finder .pt-blk{display:flex;flex-direction:column;gap:5px;}
#pt-finder .pt-blk-t{font-size:10.5px;font-weight:700;letter-spacing:.13em;color:var(--pt-muted);}
#pt-finder .pt-tags{display:flex;flex-wrap:wrap;gap:4px;}
#pt-finder .pt-tag{
  font-size:11.5px;line-height:1.5;padding:3px 9px;border-radius:999px;
  background:var(--pt-card);border:1px solid var(--pt-hair);color:var(--pt-body);
  letter-spacing:.02em;white-space:nowrap;
}
#pt-finder .pt-tag.pt-hit{background:var(--pt-brand);border-color:var(--pt-brand);color:var(--pt-ink);font-weight:700;}
#pt-finder .pt-card .pt-btn{margin-top:auto;width:100%;padding:11px 12px;}

#pt-finder .pt-empty{
  background:var(--pt-paper);border:1.2px dashed var(--pt-line);border-radius:var(--pt-r-box);
  padding:48px 24px;text-align:center;color:var(--pt-body);font-size:14px;
}

/* ---------- 比較表 ---------- */
#pt-finder .pt-tablewrap{overflow-x:auto;border:1.2px solid var(--pt-line);border-radius:var(--pt-r-box);background:var(--pt-paper);}
#pt-finder table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px;}
#pt-finder th,#pt-finder td{border-bottom:1px solid var(--pt-hair);padding:11px 14px;text-align:center;}
#pt-finder tbody tr:last-child td{border-bottom:0;}
#pt-finder th:first-child,#pt-finder td:first-child{
  text-align:left;position:sticky;left:0;background:var(--pt-paper);
  font-weight:500;color:var(--pt-body);white-space:nowrap;
}
#pt-finder thead th{background:var(--pt-card);font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--pt-ink);}
#pt-finder thead th:first-child{background:var(--pt-card);}
#pt-finder thead th span{display:block;font-weight:400;font-size:11px;color:var(--pt-body);letter-spacing:.02em;margin-top:2px;}
#pt-finder tbody tr.pt-sec td{
  background:var(--pt-card)!important;font-size:10.5px;font-weight:700;
  letter-spacing:.13em;color:var(--pt-muted);text-align:left;
}
#pt-finder .pt-dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--pt-brand);}
#pt-finder .pt-none{color:var(--pt-hair);}
#pt-finder .pt-code{font-size:11px;color:var(--pt-muted);letter-spacing:.02em;}

/* ---------- 底部抽屜（dock） ---------- */
#pt-finder .pt-backdrop{
  position:fixed;inset:0;z-index:99998;opacity:0;pointer-events:none;
  background:rgba(20,18,14,.35);
  -webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);
  transition:opacity .18s ease;
}
#pt-finder.is-dock-open .pt-backdrop{opacity:1;pointer-events:auto;transition:opacity .3s ease;}
#pt-finder .pt-dock{
  position:fixed;left:0;right:0;bottom:0;z-index:99999;
  background:var(--pt-paper);
  border-radius:10px 10px 0 0;
  padding-bottom:env(safe-area-inset-bottom,0px);
  max-height:90vh;max-height:92dvh;
  display:flex;flex-direction:column;
  transform:translateY(101%);
  transition:transform .35s cubic-bezier(.4,0,.2,1);
  visibility:hidden;
}
#pt-finder.is-dock-open .pt-dock{transform:translateY(0);visibility:visible;}
#pt-finder .pt-dock-close{
  position:absolute;top:14px;right:16px;z-index:5;
  width:44px;height:44px;border-radius:50%;
  background:rgba(255,255,255,.55);border:1.2px solid var(--pt-ink);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  font-size:22px;line-height:1;color:var(--pt-ink);font-family:var(--pt-sans);
  transition:transform .3s ease;
}
#pt-finder .pt-dock-close:hover{transform:scale(1.08);}
#pt-finder .pt-dock-scroll{
  flex:1 1 auto;min-height:0;overflow-y:auto;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
}
#pt-finder .pt-dock-inner{
  max-width:1100px;margin:0 auto;
  padding:clamp(20px,5vw,40px) clamp(20px,6vw,40px) clamp(28px,6vw,48px);
  display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);
  gap:clamp(20px,4vw,40px);align-items:start;
}
#pt-finder .pt-dock-media{background:var(--pt-media);border-radius:var(--pt-r-card);overflow:hidden;aspect-ratio:1/1;}
#pt-finder .pt-dock-media img{width:100%;height:100%;object-fit:contain;display:block;}
#pt-finder .pt-dock-title{margin-bottom:22px;}
#pt-finder .pt-dock-title .pt-model{margin-bottom:4px;}
#pt-finder .pt-dock-title h3{font-size:clamp(20px,3vw,25px);font-weight:700;line-height:1.35;margin:0;letter-spacing:.02em;}
#pt-finder .pt-dsec{margin-bottom:26px;}
#pt-finder .pt-dsec-t{
  font-size:11px;font-weight:700;letter-spacing:.13em;color:var(--pt-muted);
  margin:0 0 12px;padding-bottom:8px;border-bottom:1.2px solid var(--pt-hair);
}
#pt-finder .pt-spec{width:100%;border-collapse:collapse;font-size:13.5px;min-width:0;}
#pt-finder .pt-spec th,#pt-finder .pt-spec td{
  border-bottom:1px solid var(--pt-hair);padding:8px 0;text-align:left;position:static;background:none;
}
#pt-finder .pt-spec th{width:6.5em;font-weight:500;color:var(--pt-muted);font-size:12.5px;letter-spacing:.04em;}
#pt-finder .pt-spec td{color:var(--pt-ink);}
#pt-finder .pt-flist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px 16px;}
#pt-finder .pt-flist li{display:flex;gap:9px;align-items:baseline;font-size:13.5px;}
#pt-finder .pt-flist .pt-fc{
  flex:0 0 auto;font-size:10.5px;font-weight:700;letter-spacing:.06em;
  padding:2px 7px;border-radius:4px;background:var(--pt-card);
  border:1px solid var(--pt-hair);color:var(--pt-muted);
}
#pt-finder .pt-flist li.pt-hit .pt-fc{background:var(--pt-brand);border-color:var(--pt-brand);color:var(--pt-ink);}
#pt-finder .pt-flist li.pt-hit span:last-child{font-weight:700;}
#pt-finder .pt-certs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;}
#pt-finder .pt-certcard{border:1.2px solid var(--pt-hair);border-radius:var(--pt-r-box);overflow:hidden;background:var(--pt-paper);}
#pt-finder .pt-certcard.pt-hit{border-color:var(--pt-brand);}
#pt-finder .pt-certimg{display:block;width:100%;aspect-ratio:4/3;background:var(--pt-media);border:0;padding:0;cursor:zoom-in;}
#pt-finder .pt-certimg img{width:100%;height:100%;object-fit:cover;display:block;}
#pt-finder .pt-certmeta{padding:10px 12px 12px;}
#pt-finder .pt-certmeta b{display:block;font-size:13.5px;font-weight:700;line-height:1.4;letter-spacing:.02em;}
#pt-finder .pt-certmeta span{display:block;font-size:11.5px;color:var(--pt-muted);letter-spacing:.02em;line-height:1.6;margin-top:3px;}
#pt-finder .pt-dock-link{display:inline-block;margin-top:4px;text-decoration:none;}

/* ---------- 證書大圖 ---------- */
#pt-finder .pt-lightbox{
  position:fixed;inset:0;z-index:100000;display:none;
  align-items:center;justify-content:center;padding:24px;
  background:rgba(20,18,14,.85);
}
#pt-finder .pt-lightbox.is-on{display:flex;}
#pt-finder .pt-lightbox img{max-width:min(880px,94vw);max-height:88vh;background:#fff;border-radius:var(--pt-r-box);}
#pt-finder .pt-lightbox button{
  position:absolute;top:18px;right:22px;width:44px;height:44px;border-radius:50%;
  background:rgba(255,255,255,.55);border:1.2px solid #fff;color:var(--pt-ink);
  font-size:22px;line-height:1;cursor:pointer;font-family:var(--pt-sans);
}

@media (max-width:900px){
  #pt-finder .pt-fields{grid-template-columns:1fr;}
  #pt-finder select[multiple]{max-height:190px;}
  #pt-finder .pt-dock-inner{grid-template-columns:1fr;}
  #pt-finder .pt-dock-media{max-width:260px;}
}
@media (max-width:600px){
  #pt-finder .pt-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;}
  #pt-finder .pt-acts{width:100%;}
  #pt-finder .pt-acts .pt-btn{flex:1 1 0;}
  #pt-finder .pt-flist{grid-template-columns:1fr;}
}
</style>

<div id="pt-finder">
  <div class="pt-wrap">
    <div class="pt-head">
      <h2>安全鞋規格查詢</h2>
      <p>三個欄位可以任意組合，選好之後按「查詢」。</p>
    </div>

    <form class="pt-panel" id="pt-form">
      <div class="pt-fields">
        <div class="pt-field">
          <label for="pt-sel-product">品項<span class="pt-cnt" id="pt-cnt-p"></span></label>
          <select id="pt-sel-product"></select>
          <p class="pt-tip">選了品項後，功能與證書會自動只留下這雙鞋有的項目。</p>
        </div>
        <div class="pt-field">
          <label for="pt-sel-feature">功能<span class="pt-cnt" id="pt-cnt-f"></span></label>
          <select id="pt-sel-feature" multiple size="7"></select>
          <p class="pt-tip"><b>點一下選取，再點一下取消。</b>可以選多個。</p>
        </div>
        <div class="pt-field">
          <label for="pt-sel-cert">證書<span class="pt-cnt" id="pt-cnt-c"></span></label>
          <select id="pt-sel-cert" multiple size="7"></select>
          <p class="pt-tip">同樣點一下選取，可以選多個。</p>
        </div>
      </div>

      <div class="pt-foot">
        <div class="pt-logic">
          <label class="pt-radio"><input type="radio" name="pt-mode" value="AND" checked>全部都要有</label>
          <label class="pt-radio"><input type="radio" name="pt-mode" value="OR">有其中一項就好</label>
        </div>
        <div class="pt-acts">
          <span class="pt-dirty" id="pt-dirty" hidden>條件已變更</span>
          <button type="button" class="pt-btn pt-btn--ghost" id="pt-reset">重設</button>
          <button type="submit" class="pt-btn" id="pt-submit">查詢</button>
        </div>
      </div>
    </form>

    <div class="pt-bar">
      <div class="pt-count">符合條件 <b id="pt-num">0</b> 項</div>
      <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;">
        <span class="pt-crit" id="pt-crit"></span>
        <button type="button" class="pt-btn pt-btn--ghost" id="pt-cmpbtn" disabled>比較 (0)</button>
      </div>
    </div>

    <div id="pt-results"></div>
  </div>

  <div class="pt-backdrop" id="pt-backdrop"></div>
  <section class="pt-dock" id="pt-dock" role="dialog" aria-modal="true" aria-labelledby="pt-dock-name" hidden>
    <button type="button" class="pt-dock-close" id="pt-dock-close" aria-label="關閉">&times;</button>
    <div class="pt-dock-scroll"><div class="pt-dock-inner" id="pt-dock-inner"></div></div>
  </section>

  <div class="pt-lightbox" id="pt-lightbox"><button type="button" aria-label="關閉">&times;</button><img id="pt-lightbox-img" alt=""></div>
</div>

<script>
(function(){
"use strict";

/* =============================================================
   ①  資 料 區 ── 之後只要改這一段
   -------------------------------------------------------------
   FEATURES : 功能字典 {id, name, code}
   CERTS    : 證書字典 {id, name, note, img}
   PRODUCTS : 品項 {id, name, series, img, url, spec{}, features[], certs[]}
   ============================================================= */

var IMG_PRODUCT = "https://img.shoplineapp.com/media/image_clips/6a99080cc56f76a2c55d592e/original.png?1788413963=&owner_id=6572a1b95ad192005192397e";
var IMG_CERT_1  = "https://img.shoplineapp.com/media/image_clips/6a9907c921976070eec2dc49/original.jpg?1788413896=&owner_id=6572a1b95ad192005192397e";
var IMG_CERT_2  = "https://img.shoplineapp.com/media/image_clips/6a9907c9324646b8d906f983/original.jpg?1788413896=&owner_id=6572a1b95ad192005192397e";
var IMG_CERT_3  = "https://img.shoplineapp.com/media/image_clips/6a9907c993b47ca612e4fb08/original.jpg?1788413896=&owner_id=6572a1b95ad192005192397e";

var FEATURES = [
  {id:"toe",   name:"保護頭 200J",   code:"SB"},
  {id:"punc",  name:"防穿刺",        code:"PS/PL"},
  {id:"slip",  name:"防滑",          code:"SR(SRC)"},
  {id:"energy",name:"鞋跟緩震",      code:"E"},
  {id:"oil",   name:"鞋底耐油",      code:"FO"},
  {id:"heat",  name:"鞋底耐熱",      code:"HRO"},
  {id:"wr",    name:"全鞋防水",      code:"WR"},
  {id:"wpa",   name:"鞋面防水",      code:"WPA(WRU)"},
  {id:"hi",    name:"鞋底隔熱",      code:"HI"},
  {id:"ci",    name:"鞋底抗寒",      code:"CI"},
  {id:"an",    name:"腳踝保護",      code:"AN"},
  {id:"sc",    name:"鞋頭耐磨",      code:"SC"},
  {id:"ins",   name:"絕緣",          code:"I.S."},
  {id:"esd",   name:"抗靜電",        code:"A"},
  {id:"lg",    name:"抓梯穩定",      code:"LG"},
  {id:"blood", name:"防血液病毒滲透",code:"F1671"},
  {id:"mf",    name:"全非金屬",      code:"Metal Free"},
  {id:"dial",  name:"快旋鈕",        code:"ExpFit"},
  {id:"sd",    name:"外翻車縫",      code:"Stitch Down"}
];

var CERTS = [

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function track(n,p){ if(window.gtag){ window.gtag("event",n,p||{}); } }
function selected(sel){return Array.prototype.filter.call(sel.options,function(o){return o.selected;}).map(function(o){return o.value;});}

/* ---- 點一下選取、再點一下取消 ---- */
function makeToggle(sel){
  sel.addEventListener("mousedown",function(e){
    var o=e.target;
    if(!o||o.tagName!=="OPTION"||o.disabled) return;
    e.preventDefault();
    o.selected=!o.selected;
    sel.focus();
    sel.dispatchEvent(new Event("change",{bubbles:true}));
  });
  /* 鍵盤操作：空白鍵切換 */
  sel.addEventListener("keydown",function(e){
    if(e.key!==" ") return;
    e.preventDefault();
    var o=sel.options[sel.selectedIndex>=0?sel.selectedIndex:0];
    if(o&&!o.disabled){ o.selected=!o.selected; sel.dispatchEvent(new Event("change",{bubbles:true})); }
  });
}
makeToggle(elF); makeToggle(elC);

/* ---- 表單狀態：計數、品項連動反灰、未送出提示 ---- */
function syncFields(){
  var pid=elP.value, p=pid?P[pid]:null;

  Array.prototype.forEach.call(elF.options,function(o){
    var off = p && p.features.indexOf(o.value)<0;
    o.disabled=!!off;
    if(off) o.selected=false;
  });
  Array.prototype.forEach.call(elC.options,function(o){
    var off = p && p.certs.indexOf(o.value)<0;
    o.disabled=!!off;
    if(off) o.selected=false;
  });

  var nf=selected(elF).length, nc=selected(elC).length;
  elCntP.textContent = pid?"已選 1":"";
  elCntF.textContent = nf?("已選 "+nf):"";
  elCntC.textContent = nc?("已選 "+nc):"";

  var r=elForm.querySelector('input[name="pt-mode"]:checked');
  var srt=function(a){return a.slice().sort().join(",");};
  var same = pid===applied.product
    && srt(selected(elF))===srt(applied.features)
    && srt(selected(elC))===srt(applied.certs)
    && (r?r.value:"AND")===applied.mode;
  elDirty.hidden=same;
}

/* ---- 篩選 ---- */
function matches(p){
  if(applied.product && p.id!==applied.product) return false;
  if(applied.features.length){
    var ok=applied.mode==="AND"
      ? applied.features.every(function(f){return p.features.indexOf(f)>=0;})
      : applied.features.some(function(f){return p.features.indexOf(f)>=0;});
    if(!ok) return false;
  }
  if(applied.certs.length){
    var ok2=applied.mode==="AND"
      ? applied.certs.every(function(c){return p.certs.indexOf(c)>=0;})
      : applied.certs.some(function(c){return p.certs.indexOf(c)>=0;});
    if(!ok2) return false;
  }
  return true;
}
function results(){ return PRODUCTS.filter(matches); }
function isHitF(id){ return applied.features.indexOf(id)>=0; }
function isHitC(id){ return applied.certs.indexOf(id)>=0; }

/* ---- 結果 ---- */
function critText(){
  var bits=[];
  if(applied.product) bits.push(esc(applied.product));
  applied.features.forEach(function(id){ if(F[id]) bits.push(esc(F[id].name)); });
  applied.certs.forEach(function(id){ if(C[id]) bits.push(esc(C[id].name)); });
  if(!bits.length) return "顯示全部品項";
  var join = applied.mode==="AND" ? "　＋　" : "　或　";
  return bits.join(join);
}

function syncCmpBtn(){
  if(view==="table"){
    elCmp.innerHTML="&times;&nbsp; 關閉比較";
    elCmp.disabled=false;
    elCmp.classList.add("is-active");
    elCmp.setAttribute("aria-label","關閉比較");
  } else {
    elCmp.textContent="比較 ("+compare.length+")";
    elCmp.disabled=compare.length<2;
    elCmp.classList.remove("is-active");
    elCmp.removeAttribute("aria-label");
  }
}

function renderResults(){
  var list=results();
  elNum.textContent=list.length;
  elCrit.innerHTML=critText();
  syncCmpBtn();

  if(view==="table" && compare.length>=2){ renderTable(); return; }

  if(!list.length){
    elRes.innerHTML='<div class="pt-empty">沒有同時符合這些條件的品項。<br>可以少選幾項，或改成「有其中一項就好」再查一次。</div>';
    return;
  }
  elRes.innerHTML='<div class="pt-grid">'+list.map(function(p){
    var certTags=p.certs.map(function(id){
      return '<span class="pt-tag'+(isHitC(id)?' pt-hit':'')+'">'+esc(C[id].name)+'</span>';}).join("");
    var featTags=p.features.map(function(id){
      return '<span class="pt-tag'+(isHitF(id)?' pt-hit':'')+'">'+esc(F[id].name)+'</span>';}).join("");
    return '<article class="pt-card">'+
      '<label class="pt-cmp"><input type="checkbox" data-cmp="'+p.id+'"'+(compare.indexOf(p.id)>=0?' checked':'')+'>比較</label>'+
      '<button type="button" class="pt-thumb" data-open="'+p.id+'" aria-label="'+esc(p.name)+' 規格與證書">'+
        '<img src="'+esc(p.img)+'" alt="'+esc(p.id+" "+p.name)+'" loading="lazy">'+
      '</button>'+
      '<div class="pt-body">'+
        '<div class="pt-model">'+esc(p.id)+'</div>'+
        '<h4 class="pt-name">'+esc(p.name)+'</h4>'+
        '<div class="pt-blk"><span class="pt-blk-t">證書</span><div class="pt-tags">'+certTags+'</div></div>'+
        '<div class="pt-blk"><span class="pt-blk-t">功能</span><div class="pt-tags">'+featTags+'</div></div>'+
        '<button type="button" class="pt-btn" data-open="'+p.id+'">規格與證書</button>'+
      '</div></article>';
  }).join("")+'</div>';
}

function renderTable(){
  var ps=compare.map(function(id){return P[id];}).filter(Boolean);
  var usedF=FEATURES.filter(function(f){return ps.some(function(p){return p.features.indexOf(f.id)>=0;});});
  var usedC=CERTS.filter(function(c){return ps.some(function(p){return p.certs.indexOf(c.id)>=0;});});
  var dot=function(y){return y?'<span class="pt-dot"></span>':'<span class="pt-none">—</span>';};

  var h='<div class="pt-tablewrap"><table><thead><tr><th>項目</th>'+
    ps.map(function(p){return '<th>'+esc(p.id)+'<span>'+esc(p.name)+'</span></th>';}).join("")+'</tr></thead><tbody>';

  h+='<tr class="pt-sec"><td colspan="'+(ps.length+1)+'">規格</td></tr>';
  h+=SPEC_ROWS.map(function(r){
    return '<tr><td>'+esc(r[1])+'</td>'+ps.map(function(p){
      return '<td>'+esc(p.spec[r[0]]||"—")+'</td>';}).join("")+'</tr>';}).join("");

  h+='<tr class="pt-sec"><td colspan="'+(ps.length+1)+'">證書</td></tr>';
  h+=usedC.map(function(c){
    return '<tr><td>'+esc(c.name)+'</td>'+ps.map(function(p){
      return '<td>'+dot(p.certs.indexOf(c.id)>=0)+'</td>';}).join("")+'</tr>';}).join("");

  h+='<tr class="pt-sec"><td colspan="'+(ps.length+1)+'">功能</td></tr>';
  h+=usedF.map(function(f){
    return '<tr><td>'+esc(f.name)+(f.code?' <span class="pt-code">'+esc(f.code)+'</span>':'')+'</td>'+
      ps.map(function(p){return '<td>'+dot(p.features.indexOf(f.id)>=0)+'</td>';}).join("")+'</tr>';}).join("");

  h+='</tbody></table></div>';
  elRes.innerHTML=h;
}

/* ---- 網址狀態 ---- */
function writeHash(){
  var parts=[];
  if(applied.product) parts.push("p="+applied.product);
  if(applied.features.length) parts.push("f="+applied.features.join(","));
  if(applied.certs.length) parts.push("c="+applied.certs.join(","));
  if(applied.mode!=="AND") parts.push("m=or");
  var h=parts.length?"#pt:"+parts.join("&"):"";
  if(h!==location.hash && (h||location.hash.indexOf("#pt:")===0)){
    history.replaceState(null,"",location.pathname+location.search+h);
  }
}
function readHash(){
  if(location.hash.indexOf("#pt:")!==0) return;
  location.hash.slice(4).split("&").forEach(function(kv){
    var i=kv.indexOf("="); if(i<0) return;
    var k=kv.slice(0,i), v=decodeURIComponent(kv.slice(i+1));
    if(k==="p"&&P[v]) applied.product=v;
    if(k==="f") applied.features=v.split(",").filter(function(x){return F[x];});
    if(k==="c") applied.certs=v.split(",").filter(function(x){return C[x];});
    if(k==="m"&&v==="or") applied.mode="OR";
  });
  elP.value=applied.product;
  Array.prototype.forEach.call(elF.options,function(o){o.selected=applied.features.indexOf(o.value)>=0;});
  Array.prototype.forEach.call(elC.options,function(o){o.selected=applied.certs.indexOf(o.value)>=0;});
  var r=elForm.querySelector('input[name="pt-mode"][value="'+applied.mode+'"]'); if(r) r.checked=true;
}

/* ---- 事件 ---- */
elForm.addEventListener("change",syncFields);

elForm.addEventListener("submit",function(e){
  e.preventDefault();
  applied.product=elP.value;
  applied.features=selected(elF);
  applied.certs=selected(elC);
  var r=elForm.querySelector('input[name="pt-mode"]:checked');
  applied.mode=r?r.value:"AND";
  view="cards";
  renderResults(); writeHash(); syncFields();
  track("filter_query",{product:applied.product||"all",features:applied.features.join("|"),certs:applied.certs.join("|"),mode:applied.mode});
});

$("pt-reset").addEventListener("click",function(){
  elP.value="";
  Array.prototype.forEach.call(elF.options,function(o){o.selected=false;});
  Array.prototype.forEach.call(elC.options,function(o){o.selected=false;});
  var r=elForm.querySelector('input[name="pt-mode"][value="AND"]'); if(r) r.checked=true;
  applied={product:"",features:[],certs:[],mode:"AND"};
  view="cards";
  renderResults(); writeHash(); syncFields();
});

elCmp.addEventListener("click",function(){
  view = view==="table" ? "cards" : "table";
  if(view==="table") track("compare_open",{count:compare.length});
  renderResults();
});

elRes.addEventListener("click",function(e){
  var t=e.target.closest("[data-open]");
  if(t){ openDock(t.getAttribute("data-open")); }
});
elRes.addEventListener("change",function(e){
  var cb=e.target;
  if(!cb.hasAttribute||!cb.hasAttribute("data-cmp")) return;
  var id=cb.getAttribute("data-cmp");
  if(cb.checked){
    if(compare.length>=4){ cb.checked=false; return; }
    compare.push(id);
  } else {
    compare=compare.filter(function(x){return x!==id;});
  }
  if(compare.length<2 && view==="table"){ view="cards"; renderResults(); }
  else syncCmpBtn();
});

elDockIn.addEventListener("click",function(e){
  var t=e.target.closest("[data-cert]");
  if(!t) return;
  var c=C[t.getAttribute("data-cert")];
  elLbImg.src=c.img; elLbImg.alt=c.name;
  elLb.classList.add("is-on");
  track("cert_view",{cert_id:c.id});
});
elLb.addEventListener("click",function(){ this.classList.remove("is-on"); });
$("pt-dock-close").addEventListener("click",closeDock);
elBack.addEventListener("click",closeDock);
document.addEventListener("keydown",function(e){
  if(e.key!=="Escape") return;
  if(elLb.classList.contains("is-on")){ elLb.classList.remove("is-on"); return; }
  if(root.classList.contains("is-dock-open")) closeDock();
});

readHash();
syncFields();
renderResults();
})();
</script>
